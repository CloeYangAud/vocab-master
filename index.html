<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>词博士 · 中考词汇大师</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#0b0e14;--card:#141820;--bd:#1e2330;--tx:#f0f2f5;--t2:#6e7687;--p:#f4785c;--g:#3fb950;--r:#f85149;--y:#d2991d;--b:#58a6ff;--pp:#bc8cff;--ra:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,'PingFang SC',sans-serif;background:var(--bg);color:var(--tx);min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.screen{display:none;padding:14px 18px 110px;max-width:560px;margin:0 auto}.screen.active{display:block}

.topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 0;max-width:560px;margin:0 auto}
.topbar h1{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;letter-spacing:-0.3px}
.topbar .streak{background:linear-gradient(135deg,#f4785c,#e06048);color:#fff;padding:5px 14px;border-radius:20px;font-weight:700;font-size:13px;box-shadow:0 2px 8px rgba(244,120,92,0.25)}

/* Home */
.hero{text-align:center;padding:20px 0 10px}
.hero .owl{font-size:52px;display:inline-block;animation:mascot 2.5s ease-in-out infinite;filter:drop-shadow(0 4px 12px rgba(244,120,92,0.3))}
@keyframes mascot{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hero .greeting{font-size:15px;color:var(--t2);margin-top:6px}.hero .greeting strong{font-size:22px;color:var(--tx);display:block;margin-top:4px;font-weight:800;letter-spacing:-0.5px}
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:var(--ra);padding:16px 10px;text-align:center;transition:all .2s}.kpi:hover{border-color:#2e3a50}
.kpi .val{font-size:24px;font-weight:800;letter-spacing:-0.5px}.kpi .lbl{font-size:11px;color:var(--t2);margin-top:4px;font-weight:500}

.progress-bar{background:var(--card);border:1px solid var(--bd);border-radius:var(--ra);padding:18px;margin-bottom:14px}
.progress-bar .lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;font-weight:600}
.progress-bar .track{height:10px;background:#1a1f2b;border-radius:5px;overflow:hidden}
.progress-bar .fill{height:100%;background:linear-gradient(90deg,#f4785c,#f0883e);border-radius:5px;transition:width .5s;box-shadow:0 0 12px rgba(244,120,92,0.3)}
.cta{display:block;width:100%;padding:15px;border:none;border-radius:var(--ra);background:linear-gradient(135deg,#f4785c,#e06048);color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:-0.2px;box-shadow:0 4px 16px rgba(244,120,92,0.3);transition:all .15s}
.cta:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(244,120,92,0.4)}.cta:active{transform:scale(.97)}

/* Quiz */
.learn-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.learn-top .back{background:var(--card);border:1px solid var(--bd);padding:7px 16px;border-radius:var(--ra);cursor:pointer;font-family:inherit;font-size:13px;color:var(--t2);font-weight:500;transition:all .15s}.learn-top .back:hover{border-color:var(--b);color:var(--b)}
.learn-top .info{font-size:13px;color:var(--t2);font-weight:600}

.mascot-bar{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:var(--ra);padding:12px 16px;margin-bottom:12px}
.mascot-icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;transition:all .35s}
.mascot-icon.happy{background:rgba(63,185,80,.12);animation:mascot .6s}.mascot-icon.think{background:rgba(88,166,255,.12);animation:wiggle 1.5s infinite}
.mascot-icon.celebrate{background:rgba(188,140,255,.12);animation:spin .5s}.mascot-icon.encourage{background:rgba(248,81,73,.12);animation:nod .4s}
@keyframes spin{0%{transform:rotate(0)scale(1)}50%{transform:rotate(15deg)scale(1.12)}100%{transform:rotate(0)scale(1)}}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
.mascot-msg{font-size:14px;font-weight:500;line-height:1.4}

.ex-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;font-weight:600}
.ex-row span{background:var(--card);border:1px solid var(--bd);padding:5px 12px;border-radius:8px}
.xp-stat{color:var(--y)}.combo-stat{color:var(--p);display:none}.combo-stat.show{display:inline;animation:pop .3s}@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.dots{display:inline-flex;gap:5px}.dots span{width:8px;height:8px;border-radius:50%;background:#1a1f2b;transition:.2s}.dots span.done{background:var(--g)}.dots span.cur{background:var(--p);transform:scale(1.3);box-shadow:0 0 6px rgba(244,120,92,.4)}.dots span.wrong{background:var(--r)}

.ex-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--ra);padding:22px;min-height:240px;display:flex;flex-direction:column;transition:.25s;box-shadow:0 2px 8px rgba(0,0,0,.15)}.ex-card.shake{animation:shake .4s}.ex-card.pop{animation:cp .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes cp{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}

.badge{display:inline-block;padding:3px 12px;border-radius:12px;font-size:11px;font-weight:700;margin-bottom:10px;letter-spacing:0.2px}
.badge.tr{background:rgba(88,166,255,.12);color:var(--b)}.badge.ls{background:rgba(210,153,29,.12);color:var(--y)}
.badge.fl{background:rgba(63,185,80,.12);color:var(--g)}.badge.ph{background:rgba(188,140,255,.12);color:var(--pp)}

.prompt{font-size:26px;font-weight:800;text-align:center;margin-bottom:4px;word-break:break-word;letter-spacing:-0.5px;line-height:1.3}
.prompt.sm{font-size:19px}.sub{font-size:14px;color:var(--t2);text-align:center;margin-bottom:14px;font-weight:500}
.audio-btn{display:block;margin:0 auto 10px;width:48px;height:48px;border-radius:50%;border:2px solid var(--p);background:var(--card);cursor:pointer;font-size:22px;transition:all .15s}.audio-btn:hover{background:rgba(244,120,92,.08)}.audio-btn:active{transform:scale(.92)}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.opt{padding:14px 12px;border:1px solid var(--bd);border-radius:var(--ra);background:var(--card);cursor:pointer;font-family:inherit;font-size:15px;font-weight:600;text-align:center;transition:all .15s;min-height:48px;display:flex;align-items:center;justify-content:center;color:var(--tx);letter-spacing:-0.2px}.opt:hover{border-color:#3e4a60;background:#1a1f2b}
.opt:active{transform:scale(.96)}.opt.correct{background:rgba(63,185,80,.12);border-color:var(--g);color:var(--g)}.opt.incorrect{background:rgba(248,81,73,.12);border-color:var(--r);color:var(--r)}.opt:disabled{pointer-events:none;opacity:.7}
.fb{text-align:center;margin-top:10px;font-weight:700;font-size:16px;min-height:24px}.fb.good{color:var(--g)}.fb.bad{color:var(--r)}

.intro-word{font-size:38px;font-weight:800;text-align:center;letter-spacing:-0.5px}.intro-phonetic{font-size:16px;color:var(--t2);text-align:center;margin-bottom:8px;font-weight:500}
.intro-trans{font-size:20px;font-weight:700;color:var(--b);text-align:center;margin-bottom:14px}
.intro-phrase{display:flex;align-items:center;justify-content:center;gap:10px;margin:5px 0;font-size:14px;background:#1a1f2b;padding:9px 14px;border-radius:8px}
.intro-phrase .en{font-weight:600}.intro-phrase .zh{color:var(--t2);font-size:12px}
.intro-start{width:100%;padding:14px;border:none;margin-top:14px;background:linear-gradient(135deg,#238636,#1f7a31);color:#fff;font-size:16px;font-weight:700;border-radius:var(--ra);cursor:pointer;font-family:inherit;letter-spacing:-0.2px;box-shadow:0 4px 16px rgba(35,134,54,.25);transition:all .15s}.intro-start:hover{transform:translateY(-1px)}

.rate-section{display:none;margin-top:12px}.rate-section.show{display:block}
.rate-section h4{text-align:center;font-size:13px;color:var(--t2);margin-bottom:8px;font-weight:500}
.rate-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate-btn{padding:11px 4px;border:1px solid var(--bd);border-radius:var(--ra);background:var(--card);cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;color:var(--tx);transition:all .15s}.rate-btn:hover{border-color:#3e4a60}.rate-btn:active{transform:scale(.95)}
.rate-btn.again{color:var(--r)}.rate-btn.hard{color:var(--y)}.rate-btn.good{color:var(--b)}.rate-btn.easy{color:var(--g)}
.summary{text-align:center;padding:10px 0}.summary .big-word{font-size:30px;font-weight:800;letter-spacing:-0.5px}.summary .big-trans{font-size:17px;color:var(--b);font-weight:700;margin-top:4px}.summary .stats{font-size:13px;color:var(--t2);margin:6px 0;font-weight:500}
.perfect-badge{display:inline-block;padding:5px 16px;background:linear-gradient(135deg,#238636,#2ea043);color:#fff;border-radius:16px;font-weight:800;font-size:14px;animation:bIn .5s}@keyframes bIn{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.learn-done{text-align:center;padding:50px 16px;display:none}.learn-done .emoji{font-size:60px;margin-bottom:10px;animation:bIn .5s}.learn-done h2{font-size:20px;margin-bottom:6px;font-weight:800}.learn-done p{color:var(--t2);font-size:14px}

/* Tabs */
.dict-bar{display:flex;gap:8px;margin-bottom:14px}.dict-bar input{flex:1;padding:12px 16px;border:1px solid var(--bd);border-radius:var(--ra);background:var(--card);color:var(--tx);font-size:15px;font-family:inherit;outline:none;transition:all .15s}.dict-bar input:focus{border-color:var(--b);box-shadow:0 0 0 3px rgba(88,166,255,.1)}
.dict-bar button{padding:12px 20px;border:none;border-radius:var(--ra);background:linear-gradient(135deg,#f4785c,#e06048);color:#fff;font-weight:700;cursor:pointer;font-family:inherit;font-size:14px;transition:all .15s}
.dict-result{background:var(--card);border:1px solid var(--bd);border-radius:var(--ra);padding:18px;margin-bottom:10px}.dict-word{font-size:28px;font-weight:800;display:flex;align-items:center;gap:10px;letter-spacing:-0.5px}.dict-phonetic{font-size:15px;color:var(--t2);font-weight:500}
.dict-zh{font-size:18px;font-weight:700;color:var(--b);padding:8px 14px;background:rgba(88,166,255,.08);border-radius:8px;margin:10px 0;border-left:3px solid var(--b)}
.dict-pos{display:inline-block;padding:2px 10px;border-radius:8px;font-size:12px;font-weight:700;background:rgba(88,166,255,.08);color:var(--b);margin-bottom:6px}
.dict-def{font-size:14px;margin-bottom:3px;padding-left:10px;border-left:2px solid var(--bd);line-height:1.5}.dict-ex{font-size:13px;color:var(--t2);margin:3px 0 6px 10px;font-style:italic}
.dict-tag{display:inline-block;background:rgba(88,166,255,.08);color:var(--b);padding:5px 14px;border-radius:14px;font-weight:600;font-size:14px;cursor:pointer;margin:4px;transition:all .15s}.dict-tag:hover{background:rgba(88,166,255,.16)}
.dict-local{background:var(--card);border:1px solid var(--bd);border-radius:var(--ra);padding:12px 14px;border-left:3px solid var(--g);margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:all .15s}.dict-local:hover{border-color:var(--g)}.dict-empty{text-align:center;color:var(--t2);padding:40px 0;font-size:15px}

.ph-search{padding:12px 16px;border:1px solid var(--bd);border-radius:var(--ra);background:var(--card);color:var(--tx);font-size:15px;font-family:inherit;width:100%;outline:none;margin-bottom:12px;transition:all .15s}.ph-search:focus{border-color:var(--b);box-shadow:0 0 0 3px rgba(88,166,255,.1)}
.ph-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(30,35,48,.5);font-size:14px}.ph-item .en{font-weight:600}.ph-item .zh{font-size:13px;color:var(--t2)}

.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.stat-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--ra);padding:18px;text-align:center;transition:all .2s}.stat-card:hover{border-color:#2e3a50}
.stat-card .val{font-size:24px;font-weight:800;color:var(--p);letter-spacing:-0.5px}.stat-card .lbl{font-size:11px;color:var(--t2);margin-top:4px}
.eb-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--ra);padding:16px;margin-bottom:10px}.eb-card h3{font-size:14px;margin-bottom:10px;font-weight:700}
.eb-curve{width:100%;height:100px}.eb-stages{display:flex;gap:3px;margin-top:8px;font-size:10px}
.eb-s{flex:1;text-align:center;padding:3px 0;border-radius:5px;font-weight:600;color:var(--t2);background:#1a1f2b}.eb-s.has{background:rgba(88,166,255,.1);color:var(--b)}.eb-s.cur{background:var(--p);color:#fff}.eb-s.done{background:rgba(63,185,80,.1);color:var(--g)}
.err-book{background:var(--card);border:1px solid var(--bd);border-radius:var(--ra);padding:16px;margin-bottom:10px;border-left:3px solid var(--r)}.err-book h3{font-size:14px;margin-bottom:8px;font-weight:700}
.err-item{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(30,35,48,.5);cursor:pointer;transition:all .15s}.err-item:hover{opacity:.8}.err-item .word{font-weight:700;font-size:15px}.err-item .trans{font-size:13px;color:var(--t2);margin-top:2px}
.err-item .pct{font-size:11px;padding:3px 10px;border-radius:10px;background:rgba(248,81,73,.12);color:var(--r);font-weight:700}

.tab-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,16px));z-index:100;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.tab-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:0;border:none;cursor:pointer;padding:6px 14px;border-radius:10px;font-family:inherit;font-size:10px;color:var(--t2);transition:all .15s;font-weight:500}.tab-btn.active{color:var(--p);font-weight:700}.tab-btn .ic{font-size:20px}.tab-btn:hover{color:var(--tx)}

.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 22px;border-radius:18px;font-weight:700;font-size:14px;z-index:300;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.4)}.toast.show{opacity:1}
.xp-float{position:fixed;font-weight:800;font-size:18px;pointer-events:none;z-index:250;animation:xp-up 1s ease-out forwards;color:var(--g)}@keyframes xp-up{0%{opacity:1;transform:translateY(0)scale(1)}100%{opacity:0;transform:translateY(-60px)scale(1.4)}}
.confetti{position:fixed;pointer-events:none;z-index:250;font-size:18px;animation:cf 1.6s ease-out forwards}@keyframes cf{0%{opacity:1;transform:translateY(0)rotate(0)}100%{opacity:0;transform:translateY(280px)rotate(720deg)}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="topbar"><h1>🦉 词博士</h1><div class="streak" id="streak-badge">🔥 0 天</div></div>
<div class="screen active" id="home">
  <div class="hero"><div class="owl">🦉</div><div class="greeting" id="hero-greet"></div></div>
  <div class="kpi-row"><div class="kpi"><div class="val" id="kpi-xp" style="color:var(--y)">0</div><div class="lbl">总经验值</div></div><div class="kpi"><div class="val" id="kpi-learned" style="color:var(--b)">0</div><div class="lbl">已学单词</div></div><div class="kpi"><div class="val" id="kpi-acc" style="color:var(--g)">--%</div><div class="lbl">正确率</div></div></div>
  <div class="progress-bar"><div class="lab"><span>今日进度</span><span id="prog-text">0/20</span></div><div class="track"><div class="fill" id="prog-fill" style="width:0%"></div></div></div>
  <button class="cta" onclick="startLearning()">🎯 开始学习</button>
</div>

<div class="screen" id="learn">
  <div class="learn-top"><button class="back" onclick="showScreen('home')">← 返回</button><span class="info" id="queue-info"></span><div style="width:50px"></div></div>
  <div class="learn-done" id="learn-done"><div class="emoji">🎉</div><h2 id="done-title">任务完成</h2><p id="done-msg"></p><button class="cta" style="margin-top:16px;width:200px" onclick="resetDailyQueue()">开始新一批</button></div>
  <div id="learn-body">
    <div class="mascot-bar"><div class="mascot-icon happy" id="mascot-icon">🦉</div><div class="mascot-msg" id="mascot-msg">准备好了吗？</div></div>
    <div class="ex-row"><span class="xp-stat" id="ex-xp">⭐ 0</span><div class="dots" id="ex-dots"></div><span class="combo-stat" id="ex-combo">🔥 x1</span></div>
    <div class="ex-card" id="ex-card"><div id="ex-body"></div><div class="fb" id="ex-fb"></div></div>
    <div class="rate-section" id="rate-section"><h4>掌握程度</h4><div class="rate-btns"><button class="rate-btn again" onclick="rateWord(0)">😰 重来</button><button class="rate-btn hard" onclick="rateWord(1)">🤔 困难</button><button class="rate-btn good" onclick="rateWord(2)">😊 良好</button><button class="rate-btn easy" onclick="rateWord(3)">😎 简单</button></div></div>
  </div>
</div>

<div class="screen" id="dict"><div class="dict-bar"><input id="dict-input" placeholder="🔍 输入英文或中文查词..." onkeydown="if(event.key==='Enter')lookupDict()"><button onclick="lookupDict()">查询</button></div><div class="dict-empty" id="dict-empty">输入单词查看释义和翻译</div><div id="dict-result"></div></div>
<div class="screen" id="phrases"><input class="ph-search" id="ph-input" placeholder="🔍 搜索核心短语..." oninput="filterPhrases()"><div id="ph-count" style="font-size:13px;color:var(--t2);margin-bottom:8px"></div><div id="ph-list"></div></div>
<div class="screen" id="stats">
  <div class="stat-grid"><div class="stat-card"><div class="val" id="st-learned">0</div><div class="lbl">已学单词</div></div><div class="stat-card"><div class="val" id="st-today">0</div><div class="lbl">今日复习</div></div><div class="stat-card"><div class="val" id="st-acc">--%</div><div class="lbl">正确率</div></div><div class="stat-card"><div class="val" id="st-xp">0</div><div class="lbl">总经验值</div></div></div>
  <div class="eb-card"><h3>🧠 艾宾浩斯曲线</h3><svg class="eb-curve" id="eb-curve" viewBox="0 0 300 90" preserveAspectRatio="none"><polyline id="eb-line" fill="none" stroke="#f4785c" stroke-width="2"/></svg><div class="eb-stages" id="eb-stages"></div></div>
  <div class="err-book"><h3>📕 错题本 <span style="font-size:11px;font-weight:400;color:var(--t2)" id="err-count"></span></h3><div id="err-list"></div><button class="cta" id="err-review" style="background:linear-gradient(135deg,#da3633,#c62828);font-size:14px;padding:10px;display:none" onclick="reviewErrors()">复习全部错题</button></div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="showScreen('home')"><span class="ic">🏠</span>首页</button>
  <button class="tab-btn" onclick="startLearning()"><span class="ic">📖</span>学习</button>
  <button class="tab-btn" onclick="showScreen('dict')"><span class="ic">🔍</span>词典</button>
  <button class="tab-btn" onclick="showScreen('phrases')"><span class="ic">📝</span>短语</button>
  <button class="tab-btn" onclick="showScreen('stats')"><span class="ic">👤</span>我的</button>
</div>

<script>
var words=[],phrases=[],lName='',uS={wp:{},streak:0,lsd:'',tr:0,tc:0,tw:[],txp:0,dxp:0};
var DB='curated_words.json',EB=[1,2,4,7,15,30,60];
function td(){return new Date().toISOString().slice(0,10)}
function wbi(id){for(var i=0;i<words.length;i++)if(words[i].id===id)return words[i]}
function ls(){try{var r=localStorage.getItem('vd4');if(r)uS=JSON.parse(r)}catch(e){}}
function ss(){localStorage.setItem('vd4',JSON.stringify(uS))}

var actx=null;
function ac(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx}
function snd(t){try{var c=ac(),n=c.currentTime,o,g;

function uh(){var h=new Date().getHours(),g='早上好';if(h>=12&&h<18)g='下午好';if(h>=18)g='晚上好';document.getElementById('hero-greet').innerHTML=g+' 👋<br><strong>'+(lName||'同学')+'</strong>';document.getElementById('streak-badge').textContent='🔥 '+(uS.streak||0)+' 天';document.getElementById('kpi-xp').textContent=uS.txp||0;document.getElementById('kpi-learned').textContent=Object.keys(uS.wp).length;var tc2=0,ta2=0;for(var k in uS.wp){tc2+=uS.wp[k].correct||0;ta2+=(uS.wp[k].correct||0)+(uS.wp[k].incorrect||0)}document.getElementById('kpi-acc').textContent=ta2>0?Math.round(tc2/ta2*100)+'%':'--%';var tr2=uS.tr||0;document.getElementById('prog-text').textContent=tr2+'/20';document.getElementById('prog-fill').style.width=Math.min(tr2/20*100,100)+'%'}

function ust(){document.getElementById('st-learned').textContent=Object.keys(uS.wp).length;document.getElementById('st-today').textContent=uS.tr||0;document.getElementById('st-xp').textContent=uS.txp||0;var tc2=0,ta2=0;for(var k in uS.wp){tc2+=uS.wp[k].correct||0;ta2+=(uS.wp[k].correct||0)+(uS.wp[k].incorrect||0)}document.getElementById('st-acc').textContent=ta2>0?Math.round(tc2/ta2*100)+'%':'--%';rEB();rE()}
function rEB(){var sc=[];for(var i=0;i<=EB.length;i++)sc[i]=0;var cs2=0;for(var k in uS.wp){var s=uS.wp[k].stage||0;if(s<=EB.length)sc[s]++;cs2=Math.max(cs2,s)}var pts=[100,58,44,80,52,85,55,90,60,95].map(function(y,i){return(i/9)*300+','+(90-y/100*80)}).join(' ');document.getElementById('eb-line').setAttribute('points',pts);document.getElementById('eb-stages').innerHTML=['初学','1天','2天','4天','7天','15天','30天','掌握'].map(function(l,i){var c='eb-s';if(sc[i])c+=' has';if(i===cs2&&sc[i])c+=' cur';if(i<cs2&&sc[i])c+=' done';return'<span class="'+c+'">'+l+'<br>'+sc[i]+'词</span>'}).join('')}
function rE(){var es=[];for(var k in uS.wp){if((uS.wp[k].incorrect||0)>0)es.push([k,uS.wp[k]])}es.sort(function(a,b){return(b[1].incorrect||0)-(a[1].incorrect||0)});es=es.slice(0,12);document.getElementById('err-count').textContent=es.length?'— '+es.length+' 个待复习':'— 暂无错题 🎉';document.getElementById('err-review').style.display=es.length?'block':'none';
document.getElementById('err-list').innerHTML=es.map(function(a){var w=wbi(a[0]);if(!w)return'';var p=a[1],tot=(p.correct||0)+(p.incorrect||0),pct=tot?Math.round((p.correct||0)/tot*100):0;return'<div class="err-item" onclick="pW(\''+a[0]+'\')"><div><div class="word">'+w.word+'</div><div class="trans">'+w.translation+'</div></div><span class="pct">'+pct+'%</span></div>'}).join('')}
function reE(){var ids=[];for(var k in uS.wp)if((uS.wp[k].incorrect||0)>0)ids.push(k);if(!ids.length)return;uS.tw=ids.sort(function(){return Math.random()-.5});uS.lsd=td();ss();shSc('learn');cwI=0;sw();st('复习 '+ids.length+' 个错题')}
function pW(id){uS.tw=[id];uS.lsd=td();ss();shSc('learn');cwI=0;sw();st('练习: '+(wbi(id)||{}).word||'')}
function st(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}

async function init(){
  try{words=await(await fetch(DB)).json()}catch(e){st('⚠️ 加载失败');return}
  try{phrases=await(await fetch('phrases.json')).json()}catch(e){}
  ls();lName=uS.ln||'';
  if(!lName){lName=prompt('我是词博士 🦉\n你叫什么名字？','同学')||'同学';uS.ln=lName;ss()}
  if(uS.lsd!==td()){uS.tr=0;uS.tc=0;uS.dxp=0}
  uS.streak=cs();ss();uh();ust();
  document.addEventListener('click',function(){try{ac().resume()}catch(e){}},{once:true});
  document.getElementById('ph-count').textContent='共 '+(phrases.length||0)+' 条';
}
init();
</script>
