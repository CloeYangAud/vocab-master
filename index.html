<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>词博士 — 中考英语词汇大师</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #FF6B35;
  --primary-light: #FF8C5A;
  --secondary: #004E89;
  --accent: #F7C948;
  --bg: #FAFAFA;
  --card-bg: #FFFFFF;
  --text: #1A1A2E;
  --text-secondary: #6B7280;
  --success: #10B981;
  --error: #EF4444;
  --radius: 12px;
  --radius-lg: 24px;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --safe-bottom: env(safe-area-inset-bottom, 16px);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100dvh;
}

/* Tab Bar */
.tab-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--card-bg);
  border-top: 1px solid #E5E7EB;
  display: flex;
  justify-content: space-around;
  padding: 8px 0 calc(8px + var(--safe-bottom));
  z-index: 100;
  box-shadow: 0 -2px 12px rgba(0,0,0,0.04);
}
.tab-btn {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: none; border: none; cursor: pointer;
  padding: 4px 16px; border-radius: 8px;
  font-family: inherit; font-size: 11px; color: var(--text-secondary);
  transition: all 150ms ease-out;
  -webkit-tap-highlight-color: transparent;
  min-width: 60px;
}
.tab-btn.active { color: var(--primary); font-weight: 600; }
.tab-btn .tab-icon { font-size: 22px; line-height: 1; }
.tab-btn:active { transform: scale(0.95); }

/* Screens */
.screen { display: none; padding: 16px 16px 100px; max-width: 600px; margin: 0 auto; }
.screen.active { display: block; }

/* Home Screen */
.home-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0 16px;
}
.home-greeting { font-size: 13px; color: var(--text-secondary); }
.home-greeting strong { font-size: 20px; color: var(--text); display: block; margin-top: 2px; }
.streak-badge {
  display: flex; align-items: center; gap: 4px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white; padding: 8px 14px; border-radius: var(--radius-lg);
  font-weight: 700; font-size: 15px;
  box-shadow: 0 4px 12px rgba(255,107,53,0.3);
  animation: pulse-glow 2s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 4px 12px rgba(255,107,53,0.3); }
  50% { box-shadow: 0 4px 24px rgba(255,107,53,0.5); }
}
.xp-badge {
  display: flex; align-items: center; gap: 4px;
  background: linear-gradient(135deg, var(--accent), #FBBF24);
  color: #92400E; padding: 6px 12px; border-radius: var(--radius-lg);
  font-weight: 700; font-size: 13px; margin-top: 8px;
}
.progress-card {
  background: var(--card-bg); border-radius: var(--radius);
  padding: 24px; margin: 8px 0 16px;
  box-shadow: var(--shadow); text-align: center;
}
.progress-ring-container { position: relative; width: 160px; height: 160px; margin: 0 auto 16px; }
.progress-ring { transform: rotate(-90deg); }
.progress-ring .bg { fill: none; stroke: #E5E7EB; stroke-width: 10; }
.progress-ring .fill { fill: none; stroke: var(--primary); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 600ms ease-out; }
.progress-center {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  text-align: center;
}
.progress-center .count { font-size: 32px; font-weight: 700; color: var(--primary); }
.progress-center .label { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.cta-btn {
  display: block; width: 100%; padding: 16px; border: none;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white; font-size: 18px; font-weight: 700; border-radius: var(--radius);
  cursor: pointer; font-family: inherit;
  box-shadow: 0 4px 16px rgba(255,107,53,0.35);
  transition: all 150ms ease-out;
  -webkit-tap-highlight-color: transparent;
}
.cta-btn:active { transform: scale(0.97); opacity: 0.9; }
.today-preview { margin-top: 20px; }
.today-preview h3 { font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.today-preview h3::before { content: '📚'; }
.word-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.word-chip {
  background: var(--card-bg); border: 1px solid #E5E7EB;
  padding: 6px 14px; border-radius: var(--radius-lg);
  font-size: 14px; font-weight: 500; cursor: pointer;
  transition: all 150ms ease-out;
}
.word-chip:hover { border-color: var(--primary); color: var(--primary); }
.word-chip.mastered { background: #D1FAE5; border-color: var(--success); color: #065F46; }
.word-chip.learning { background: #FEF3C7; border-color: var(--accent); color: #92400E; }

/* =============== LEARN SCREEN (EXERCISE MODE) =============== */
.learn-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px;
}
.learn-header .back-btn {
  background: var(--card-bg); border: 1px solid #E5E7EB;
  padding: 8px 16px; border-radius: var(--radius);
  cursor: pointer; font-family: inherit; font-size: 14px;
  color: var(--text-secondary);
  -webkit-tap-highlight-color: transparent;
}
.learn-header .queue-info { font-size: 13px; color: var(--text-secondary); }

/* Top bar: XP + Combo + Progress */
.ex-topbar {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px; padding: 10px 14px;
  background: var(--card-bg); border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.ex-xp {
  font-weight: 700; font-size: 15px; color: var(--accent);
  display: flex; align-items: center; gap: 4px;
}
.ex-combo {
  font-weight: 700; font-size: 14px; color: var(--primary);
  margin-left: auto; display: flex; align-items: center; gap: 4px;
  transition: all 200ms;
}
.ex-combo.fire { animation: combo-pop 300ms ease-out; color: #DC2626; }
@keyframes combo-pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.4); }
  100% { transform: scale(1); }
}
.ex-progress-dots {
  display: flex; gap: 6px; align-items: center;
}
.ex-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: #E5E7EB; transition: all 200ms;
}
.ex-dot.done { background: var(--success); }
.ex-dot.current { background: var(--primary); transform: scale(1.3); }
.ex-dot.wrong { background: var(--error); }

/* Exercise container */
.ex-container {
  background: var(--card-bg); border-radius: var(--radius);
  padding: 24px 20px; box-shadow: var(--shadow);
  min-height: 320px; display: flex; flex-direction: column;
  transition: all 200ms;
}
.ex-container.shake { animation: ex-shake 400ms ease-out; }
.ex-container.pop { animation: ex-pop 300ms ease-out; }
@keyframes ex-shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}
@keyframes ex-pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.03); }
  100% { transform: scale(1); }
}

.ex-type-label {
  font-size: 12px; font-weight: 600; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
}
.ex-prompt {
  font-size: 28px; font-weight: 700; color: var(--text);
  text-align: center; margin-bottom: 8px; word-break: break-word;
}
.ex-prompt.small { font-size: 22px; }
.ex-subprompt {
  font-size: 15px; color: var(--text-secondary);
  text-align: center; margin-bottom: 20px;
}
.ex-audio-btn {
  display: block; margin: 0 auto 16px; width: 56px; height: 56px;
  border-radius: 50%; border: 3px solid var(--primary);
  background: var(--card-bg); cursor: pointer; font-size: 28px;
  transition: all 150ms; -webkit-tap-highlight-color: transparent;
}
.ex-audio-btn:active { transform: scale(1.1); background: #FFF7F0; }
.ex-audio-btn.playing { animation: audio-pulse 0.8s ease-in-out infinite; background: #FFF7F0; }
@keyframes audio-pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); box-shadow: 0 0 0 8px rgba(255,107,53,0.15); }
}

/* Option buttons */
.ex-options {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; margin-top: auto;
}
.ex-options.single-col { grid-template-columns: 1fr; }
.ex-option {
  padding: 16px 12px; border: 2px solid #E5E7EB;
  border-radius: var(--radius); background: var(--card-bg);
  cursor: pointer; font-family: inherit; font-size: 16px;
  font-weight: 600; text-align: center;
  transition: all 150ms ease-out;
  -webkit-tap-highlight-color: transparent;
  word-break: break-word; min-height: 56px;
  display: flex; align-items: center; justify-content: center;
}
.ex-option:active { transform: scale(0.96); }
.ex-option.correct {
  background: #D1FAE5; border-color: var(--success); color: #065F46;
  animation: option-correct 400ms ease-out;
}
.ex-option.incorrect {
  background: #FEE2E2; border-color: var(--error); color: #991B1B;
  animation: option-incorrect 400ms ease-out;
}
.ex-option.reveal {
  background: #D1FAE5; border-color: var(--success); color: #065F46;
  border-style: dashed;
}
.ex-option:disabled { pointer-events: none; opacity: 0.7; }
@keyframes option-correct {
  0% { transform: scale(1); }
  40% { transform: scale(1.05); }
  100% { transform: scale(1); }
}
@keyframes option-incorrect {
  0% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  50% { transform: translateX(6px); }
  75% { transform: translateX(-3px); }
  100% { transform: translateX(0); }
}

/* Feedback overlay */
.ex-feedback {
  text-align: center; margin-top: 16px; font-weight: 700; font-size: 18px;
  min-height: 28px; transition: all 200ms;
}
.ex-feedback.correct { color: var(--success); }
.ex-feedback.incorrect { color: var(--error); }

/* Continue button */
.ex-continue {
  display: none; width: 100%; margin-top: 12px; padding: 14px;
  border: none; border-radius: var(--radius);
  background: var(--primary); color: white;
  font-size: 16px; font-weight: 700; cursor: pointer;
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}
.ex-continue.show { display: block; }
.ex-continue:active { opacity: 0.9; transform: scale(0.98); }

/* Word intro card */
.ex-intro-card {
  text-align: center;
}
.ex-intro-word {
  font-size: 40px; font-weight: 700; color: var(--text); margin-bottom: 4px;
}
.ex-intro-phonetic {
  font-size: 18px; color: var(--text-secondary); margin-bottom: 12px;
}
.ex-intro-trans {
  font-size: 22px; color: var(--secondary); font-weight: 600; margin-bottom: 20px;
}
.ex-intro-phrases {
  text-align: left; margin-bottom: 20px;
}
.ex-intro-phrase-item {
  background: #F3F4F6; padding: 10px 14px; border-radius: 8px;
  margin-bottom: 8px; display: flex; justify-content: space-between;
  align-items: center; font-size: 14px;
}
.ex-intro-ready {
  width: 100%; padding: 14px; border: none;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white; font-size: 17px; font-weight: 700;
  border-radius: var(--radius); cursor: pointer; font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}
.ex-intro-ready:active { opacity: 0.9; transform: scale(0.98); }

/* Learn empty */
.learn-empty { text-align: center; padding: 40px 20px; }
.learn-empty .emoji { font-size: 64px; margin-bottom: 16px; }
.learn-empty h2 { font-size: 20px; color: var(--text); margin-bottom: 8px; }
.learn-empty p { color: var(--text-secondary); margin-bottom: 8px; }

/* Rate buttons (SRS) */
.rate-buttons {
  display: none; grid-template-columns: repeat(4, 1fr);
  gap: 8px; margin-top: 16px;
}
.rate-buttons.show { display: grid; }
.rate-btn {
  padding: 12px 8px; border: 2px solid #E5E7EB;
  border-radius: var(--radius); background: var(--card-bg);
  cursor: pointer; font-family: inherit; font-size: 13px;
  font-weight: 600; transition: all 150ms ease-out;
  -webkit-tap-highlight-color: transparent;
}
.rate-btn:active { transform: scale(0.95); }
.rate-btn.again { color: var(--error); }
.rate-btn.hard { color: var(--accent); }
.rate-btn.good { color: var(--secondary); }
.rate-btn.easy { color: var(--success); }
.rate-btn:active.again { background: #FEE2E2; border-color: var(--error); }
.rate-btn:active.hard { background: #FEF3C7; border-color: var(--accent); }
.rate-btn:active.good { background: #DBEAFE; border-color: var(--secondary); }
.rate-btn:active.easy { background: #D1FAE5; border-color: var(--success); }

/* Lesson complete */
.lesson-complete {
  text-align: center; padding: 20px;
}
.lesson-complete .emoji { font-size: 72px; margin-bottom: 12px; animation: bounce-in 500ms ease-out; }
.lesson-complete h3 { font-size: 22px; margin-bottom: 8px; }
.lesson-complete .xp-earned { font-size: 28px; font-weight: 700; color: var(--accent); }
@keyframes bounce-in {
  0% { transform: scale(0); }
  60% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

/* Word Bank */
.wb-search {
  width: 100%; padding: 12px 16px; border: 2px solid #E5E7EB;
  border-radius: var(--radius); font-size: 16px; font-family: inherit;
  margin-bottom: 16px; outline: none; transition: border-color 150ms;
}
.wb-search:focus { border-color: var(--primary); }
.wb-filters { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; }
.wb-filter {
  padding: 8px 16px; border: 2px solid #E5E7EB;
  border-radius: var(--radius-lg); background: var(--card-bg);
  font-size: 13px; font-weight: 600; cursor: pointer;
  font-family: inherit; white-space: nowrap;
  transition: all 150ms ease-out;
}
.wb-filter.active { background: var(--primary); color: white; border-color: var(--primary); }
.wb-word-item {
  background: var(--card-bg); padding: 14px 16px;
  border-radius: var(--radius); margin-bottom: 8px;
  box-shadow: var(--shadow); cursor: pointer;
  transition: all 150ms ease-out;
  display: flex; justify-content: space-between; align-items: center;
}
.wb-word-item:active { transform: scale(0.98); }
.wb-word-main { font-size: 17px; font-weight: 600; }
.wb-word-sub { font-size: 13px; color: var(--text-secondary); }
.wb-word-grade {
  font-size: 11px; padding: 2px 8px; border-radius: 12px;
  font-weight: 600;
}
.wb-word-grade.g7 { background: #DBEAFE; color: var(--secondary); }
.wb-word-grade.g8 { background: #FEF3C7; color: #92400E; }
.wb-word-grade.g9 { background: #FEE2E2; color: #991B1B; }

/* Word Detail Modal */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.5); z-index: 200;
  align-items: center; justify-content: center;
  padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal-card {
  background: var(--card-bg); border-radius: var(--radius);
  padding: 24px; max-width: 400px; width: 100%;
  max-height: 80vh; overflow-y: auto;
  box-shadow: var(--shadow-lg);
}
.modal-close {
  float: right; background: none; border: none;
  font-size: 24px; cursor: pointer; color: var(--text-secondary);
  padding: 4px 8px; border-radius: 8px;
}
.modal-card h3 { font-size: 28px; margin-bottom: 4px; }

/* Stats Screen */
.stat-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 12px; margin-bottom: 20px;
}
.stat-item {
  background: var(--card-bg); padding: 16px; border-radius: var(--radius);
  box-shadow: var(--shadow); text-align: center;
}
.stat-value { font-size: 28px; font-weight: 700; color: var(--primary); }
.stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.weak-words { margin-top: 20px; }
.weak-words h3 { font-size: 16px; margin-bottom: 12px; }
.weak-word {
  background: var(--card-bg); padding: 10px 14px;
  border-left: 4px solid var(--error); border-radius: 0 8px 8px 0;
  margin-bottom: 8px; box-shadow: var(--shadow);
  font-size: 14px;
}

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: white; padding: 12px 24px;
  border-radius: var(--radius-lg); font-weight: 600;
  z-index: 300; opacity: 0; transition: opacity 200ms;
  pointer-events: none;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- Home Screen -->
<div class="screen active" id="home-screen">
  <div class="home-header">
    <div>
      <div class="home-greeting" id="greeting">加载中...</div>
      <div class="xp-badge" id="xp-badge-home">⭐ 0 XP</div>
    </div>
    <div class="streak-badge" id="streak-badge">🔥 0 天</div>
  </div>
  <div class="progress-card">
    <div class="progress-ring-container">
      <svg class="progress-ring" width="160" height="160" viewBox="0 0 160 160">
        <circle class="bg" cx="80" cy="80" r="72"/>
        <circle class="fill" id="progress-circle" cx="80" cy="80" r="72"
                stroke-dasharray="452" stroke-dashoffset="452"/>
      </svg>
      <div class="progress-center">
        <div class="count" id="progress-count">0/20</div>
        <div class="label">今日目标</div>
      </div>
    </div>
    <button class="cta-btn" onclick="startLearning()">🎯 开始学习</button>
  </div>
  <div class="today-preview">
    <h3>今日待复习</h3>
    <div class="word-chips" id="word-chips"></div>
  </div>
</div>

<!-- Learn Screen -->
<div class="screen" id="learn-screen">
  <div class="learn-header">
    <button class="back-btn" onclick="showScreen('home')">← 返回</button>
    <span class="queue-info" id="queue-info"></span>
    <div style="width:60px"></div>
  </div>

  <div class="learn-empty" id="learn-empty">
    <div class="emoji">🎉</div>
    <h2>今日任务已完成！</h2>
    <p>明天再来吧，坚持就是胜利 💪</p>
    <button class="cta-btn" style="margin-top:20px; width:200px" onclick="resetDailyQueue()">开始新一批</button>
  </div>

  <div id="learn-content" style="display:none">
    <!-- XP + Combo + Progress dots -->
    <div class="ex-topbar">
      <span class="ex-xp" id="ex-xp">⭐ 0</span>
      <div class="ex-progress-dots" id="ex-dots"></div>
      <span class="ex-combo" id="ex-combo" style="display:none">🔥 x1</span>
    </div>

    <!-- Exercise area -->
    <div class="ex-container" id="ex-container">
      <div class="ex-type-label" id="ex-type-label"></div>
      <div id="ex-body"></div>
      <div class="ex-feedback" id="ex-feedback"></div>
      <button class="ex-continue" id="ex-continue" onclick="nextExercise()">继续 →</button>
    </div>

    <!-- SRS Rating (shown after all exercises) -->
    <div class="rate-buttons" id="rate-buttons">
      <button class="rate-btn again" onclick="rateWord(0)">😰 重来<br><small>Again</small></button>
      <button class="rate-btn hard" onclick="rateWord(1)">🤔 困难<br><small>Hard</small></button>
      <button class="rate-btn good" onclick="rateWord(2)">😊 良好<br><small>Good</small></button>
      <button class="rate-btn easy" onclick="rateWord(3)">😎 简单<br><small>Easy</small></button>
    </div>
  </div>
</div>

<!-- Word Bank Screen -->
<div class="screen" id="wordbank-screen">
  <input class="wb-search" id="wb-search" placeholder="🔍 搜索单词..." oninput="filterWords()">
  <div class="wb-filters">
    <button class="wb-filter active" onclick="setFilter('all', this)">全部</button>
    <button class="wb-filter" onclick="setFilter('7', this)">初一</button>
    <button class="wb-filter" onclick="setFilter('8', this)">初二</button>
    <button class="wb-filter" onclick="setFilter('9', this)">初三</button>
  </div>
  <div id="wb-word-list"></div>
</div>

<!-- Stats Screen -->
<div class="screen" id="stats-screen">
  <div class="stat-grid">
    <div class="stat-item">
      <div class="stat-value" id="stat-learned">0</div>
      <div class="stat-label">已学单词</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="stat-today">0</div>
      <div class="stat-label">今日复习</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="stat-accuracy">--%</div>
      <div class="stat-label">正确率</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="stat-streak">0 天</div>
      <div class="stat-label">连续打卡</div>
    </div>
  </div>
  <div class="stat-item" style="margin-bottom:12px">
    <div class="stat-value" id="stat-xp">0</div>
    <div class="stat-label">总经验值 (XP)</div>
  </div>
  <div class="weak-words">
    <h3>⚠️ 需要加强的单词</h3>
    <div id="weak-words-list"></div>
  </div>
  <button class="cta-btn" style="margin-top:20px; background:var(--text-secondary)" onclick="resetAllProgress()">
    🔄 重置学习进度
  </button>
</div>

<!-- Word Detail Modal -->
<div class="modal-overlay" id="word-modal" onclick="closeModal(event)">
  <div class="modal-card" id="modal-card" onclick="event.stopPropagation()"></div>
</div>

<!-- Tab Bar -->
<div class="tab-bar">
  <button class="tab-btn active" onclick="showScreen('home')">
    <span class="tab-icon">🏠</span>首页
  </button>
  <button class="tab-btn" onclick="startLearning()">
    <span class="tab-icon">📖</span>学习
  </button>
  <button class="tab-btn" onclick="showScreen('wordbank')">
    <span class="tab-icon">📚</span>词库
  </button>
  <button class="tab-btn" onclick="showScreen('stats')">
    <span class="tab-icon">👤</span>我的
  </button>
</div>

<script>
// ═══════════════════ DATA & STATE ═══════════════════
let words = [];
let userState = {
  wordProgress: {},  // wordId -> {ease, interval, reps, nextReview, correct, incorrect}
  streak: 0,
  lastStudyDate: '',
  dailyGoal: 20,
  todayReviewed: 0,
  todayCorrect: 0,
  todayWords: [],    // wordIds reviewed today
  totalXP: 0,
  todayXP: 0
};

const DAILY_NEW_LIMIT = 10;
const DAILY_REVIEW_LIMIT = 20;

// Persistence
function loadState() {
  try {
    const raw = localStorage.getItem('vocab-master-state');
    if (raw) {
      const parsed = JSON.parse(raw);
      userState = { ...userState, ...parsed };
    }
  } catch(e) { console.warn('state load failed', e); }
}
function saveState() {
  localStorage.setItem('vocab-master-state', JSON.stringify(userState));
}

// ═══════════════════ SM-2 Algorithm ═══════════════════
function sm2(quality, prevEase, prevInterval, prevReps) {
  let ease = prevEase || 2.5;
  let interval = prevInterval || 0;
  let reps = prevReps || 0;

  const qMap = {0: 2, 1: 3, 2: 4, 3: 5};
  const q = qMap[quality] || 3;

  if (q < 3) {
    reps = 0;
    interval = 1;
  } else {
    if (reps === 0) interval = 1;
    else if (reps === 1) interval = 6;
    else interval = Math.round(interval * ease);
    reps++;
  }

  ease = ease + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02));
  ease = Math.max(1.3, ease);

  return { ease, interval, reps };
}

// ═══════════════════ Daily Queue ═══════════════════
function todayStr() { return new Date().toISOString().slice(0, 10); }

function getDueWords() {
  const today = todayStr();
  const due = [];
  const allIds = words.map(w => w.id);
  const shuffled = [...allIds].sort(() => Math.random() - 0.5);

  for (const id of shuffled) {
    const p = userState.wordProgress[id];
    if (!p || !p.nextReview || p.nextReview <= today) {
      due.push(id);
    }
  }

  return due.slice(0, Math.max(DAILY_REVIEW_LIMIT, due.length));
}

function getTodayWords() {
  let todayWords = userState.todayWords || [];
  if (userState.lastStudyDate !== todayStr()) {
    todayWords = [];
  }
  if (todayWords.length === 0) {
    todayWords = getDueWords();
  }
  return todayWords;
}

function startLearning() {
  userState.todayWords = getTodayWords();
  userState.lastStudyDate = todayStr();
  userState.streak = calculateStreak();
  updateStreakForToday();
  saveState();

  if (userState.todayWords.length === 0) {
    userState.todayWords = words.map(w => w.id).sort(() => Math.random() - 0.5);
    saveState();
  }

  showScreen('learn');
  currentWordIdx = 0;
  startWordLesson();
}

function resetDailyQueue() {
  userState.todayWords = getDueWords();
  if (userState.todayWords.length === 0) {
    userState.todayWords = words.map(w => w.id).sort(() => Math.random() - 0.5);
  }
  saveState();
  currentWordIdx = 0;
  document.getElementById('learn-empty').style.display = 'none';
  document.getElementById('learn-content').style.display = '';
  startWordLesson();
}

// ═══════════════════ Streak ═══════════════════
function calculateStreak() {
  let streak = userState.streak || 0;
  const today = new Date();
  const last = userState.lastStudyDate ? new Date(userState.lastStudyDate) : null;

  if (!last) return 1;

  const diffDays = Math.floor((today - last) / (1000 * 60 * 60 * 24));

  if (diffDays === 0) return streak;
  if (diffDays === 1) return streak + 1;
  if (diffDays > 1) return 1;

  return streak;
}

function updateStreakForToday() {
  const s = calculateStreak();
  userState.streak = s;
  userState.lastStudyDate = todayStr();
  saveState();
  updateStreakUI();
}

function updateStreakUI() {
  const s = userState.streak || 0;
  document.getElementById('streak-badge').textContent = '\uD83D\uDD25 ' + s + ' 天';
  document.getElementById('stat-streak').textContent = s + ' 天';
}

// ═══════════════════ Sound Effects (Web Audio API) ═══════════════════
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioCtx;
}

function playSound(type) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    const now = ctx.currentTime;
    if (type === 'correct') {
      // Happy ascending two-note
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523, now);       // C5
      osc.frequency.setValueAtTime(659, now + 0.08); // E5
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.2);
    } else if (type === 'incorrect') {
      // Low buzz
      osc.type = 'square';
      osc.frequency.setValueAtTime(180, now);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.start(now);
      osc.stop(now + 0.3);
    } else if (type === 'combo') {
      // Rising sparkle
      osc.type = 'sine';
      osc.frequency.setValueAtTime(660, now);
      osc.frequency.setValueAtTime(880, now + 0.05);
      osc.frequency.setValueAtTime(1100, now + 0.1);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.start(now);
      osc.stop(now + 0.3);
    } else if (type === 'complete') {
      // Fanfare
      const notes = [523, 659, 784, 1047];
      notes.forEach((freq, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine';
        const t = now + i * 0.12;
        o.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(0.2, t);
        g.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
        o.start(t);
        o.stop(t + 0.25);
      });
    }
  } catch(e) { /* audio not critical */ }
}

// ═══════════════════ EXERCISE SYSTEM ═══════════════════
let currentWordIdx = 0;
let currentExerciseIdx = 0;
let exerciseAnswered = false;
let sessionXP = 0;
let sessionCombo = 0;
let wordExercises = []; // The array of exercises for current word

// Define exercise sequence per word
const EXERCISE_TYPES = ['intro', 'mc_enzh', 'listening', 'fill_blank'];

function getWordById(id) {
  return words.find(w => w.id === id);
}

function getCurrentWordId() {
  const tw = userState.todayWords || [];
  if (currentWordIdx < tw.length) return tw[currentWordIdx];
  return null;
}

// Pick distractors from other words (same grade preferred)
function getDistractors(word, count, pickField) {
  // pickField: 'translation' for ZH distractors, 'word' for EN distractors
  const others = words.filter(w => w.id !== word.id);
  // Prefer same grade
  const sameGrade = others.filter(w => w.grade === word.grade);
  const pool = sameGrade.length >= count ? sameGrade : others;
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, count).map(w => w[pickField]);
}

function generateExercises(word) {
  const exs = [];

  // 1. INTRO: Show word with pronunciation
  exs.push({
    type: 'intro',
    word: word,
    label: '新单词'
  });

  // 2. Multiple Choice EN→ZH
  const zhOptions = getDistractors(word, 3, 'translation');
  const zhCorrect = word.translation;
  const zhAll = [zhCorrect, ...zhOptions].sort(() => Math.random() - 0.5);
  exs.push({
    type: 'mc_enzh',
    word: word,
    label: '选择正确释义',
    prompt: word.word,
    subprompt: '选择这个单词的中文意思',
    options: zhAll,
    correct: zhCorrect
  });

  // 3. Listening: hear the word, pick the English word
  const enOptions = getDistractors(word, 3, 'word');
  const enCorrect = word.word;
  const enAll = [enCorrect, ...enOptions].sort(() => Math.random() - 0.5);
  exs.push({
    type: 'listening',
    word: word,
    label: '听力选择',
    prompt: '🔊 听到的是哪个单词？',
    subprompt: '点击喇叭听发音',
    options: enAll,
    correct: enCorrect,
    autoPlay: true
  });

  // 4. Fill in the blank
  if (word.examples && word.examples.length > 0) {
    const example = word.examples[Math.floor(Math.random() * word.examples.length)];
    const sentence = example.sentence;
    // Replace the word (case-insensitive) with _____
    const blankSentence = sentence.replace(new RegExp(word.word, 'gi'), '_____');
    const fillOptions = getDistractors(word, 3, 'word');
    const fillAll = [word.word, ...fillOptions].sort(() => Math.random() - 0.5);
    exs.push({
      type: 'fill_blank',
      word: word,
      label: '完形填空',
      prompt: blankSentence,
      subprompt: example.translation,
      options: fillAll,
      correct: word.word
    });
  } else {
    // Fallback: MC ZH→EN if no example sentences
    const enOpts2 = getDistractors(word, 3, 'word');
    const enCorrect2 = word.word;
    const enAll2 = [enCorrect2, ...enOpts2].sort(() => Math.random() - 0.5);
    exs.push({
      type: 'mc_zhen',
      word: word,
      label: '选择正确单词',
      prompt: word.translation,
      subprompt: '选择对应的英文单词',
      options: enAll2,
      correct: enCorrect2
    });
  }

  return exs;
}

function startWordLesson() {
  const wid = getCurrentWordId();
  if (!wid) {
    document.getElementById('learn-empty').style.display = '';
    document.getElementById('learn-content').style.display = 'none';
    return;
  }

  document.getElementById('learn-empty').style.display = 'none';
  document.getElementById('learn-content').style.display = '';
  document.getElementById('rate-buttons').classList.remove('show');

  const word = getWordById(wid);
  if (!word) {
    currentWordIdx++;
    startWordLesson();
    return;
  }

  wordExercises = generateExercises(word);
  currentExerciseIdx = 0;
  exerciseAnswered = false;
  updateQueueInfo();
  renderExerciseDots();
  updateTopBar();
  renderExercise();
}

function updateQueueInfo() {
  const tw = userState.todayWords || [];
  document.getElementById('queue-info').textContent = (currentWordIdx + 1) + ' / ' + tw.length;
}

function renderExerciseDots() {
  const dotsEl = document.getElementById('ex-dots');
  dotsEl.innerHTML = wordExercises.map((ex, i) => {
    let cls = 'ex-dot';
    if (i < currentExerciseIdx) {
      cls += ' done';
    } else if (i === currentExerciseIdx) {
      cls += ' current';
    }
    return '<span class="' + cls + '"></span>';
  }).join('');
}

function getExerciseResult(exIdx) {
  // Check if this exercise was answered correctly
  // For intro, it's always "done"
  if (wordExercises[exIdx].type === 'intro') return 'done';
  // We track this via a data attribute on the container
  const container = document.getElementById('ex-container');
  const result = container.dataset['ex' + exIdx + 'result'];
  return result || '';
}

function updateTopBar() {
  document.getElementById('ex-xp').textContent = '⭐ ' + sessionXP;
  const comboEl = document.getElementById('ex-combo');
  if (sessionCombo >= 3) {
    comboEl.style.display = '';
    comboEl.textContent = '🔥 x' + sessionCombo;
  } else {
    comboEl.style.display = 'none';
  }
}

function renderExercise() {
  if (currentExerciseIdx >= wordExercises.length) {
    showSRSRating();
    return;
  }

  exerciseAnswered = false;
  const ex = wordExercises[currentExerciseIdx];
  document.getElementById('ex-type-label').textContent = ex.label;
  document.getElementById('ex-feedback').textContent = '';
  document.getElementById('ex-feedback').className = 'ex-feedback';
  document.getElementById('ex-continue').classList.remove('show');
  document.getElementById('ex-container').classList.remove('shake', 'pop');
  document.getElementById('rate-buttons').classList.remove('show');
  renderExerciseDots();

  const body = document.getElementById('ex-body');

  if (ex.type === 'intro') {
    renderIntro(ex, body);
  } else if (ex.type === 'mc_enzh' || ex.type === 'mc_zhen') {
    renderMultipleChoice(ex, body);
  } else if (ex.type === 'listening') {
    renderListening(ex, body);
  } else if (ex.type === 'fill_blank') {
    renderFillBlank(ex, body);
  }
}

function renderIntro(ex, body) {
  const w = ex.word;
  body.innerHTML = `
    <div class="ex-intro-card">
      <div class="ex-intro-word">${w.word}</div>
      <div class="ex-intro-phonetic">${w.phonetic}</div>
      <button class="ex-audio-btn" id="ex-audio-btn" onclick="playWordAudio('${w.word.replace(/'/g, "\\'")}')">🔊</button>
      <div class="ex-intro-trans">${w.translation}</div>
      <div class="ex-intro-phrases">
        ${w.phrases.map(p => `
          <div class="ex-intro-phrase-item">
            <span><strong>${p.phrase}</strong><br><span style="color:var(--text-secondary);font-size:12px">${p.translation}</span></span>
            <button class="audio-btn" onclick="event.stopPropagation(); speakPhrase('${p.phrase.replace(/'/g, "\\'")}')">🔊</button>
          </div>
        `).join('')}
      </div>
      <button class="ex-intro-ready" onclick="advanceIntro()">准备好了，开始练习 →</button>
    </div>
  `;

  // Auto-play the word pronunciation
  setTimeout(() => playWordAudio(w.word), 300);
}

function advanceIntro() {
  exerciseAnswered = true;
  const container = document.getElementById('ex-container');
  container.dataset['ex' + currentExerciseIdx + 'result'] = 'done';
  showContinue();
}

function renderMultipleChoice(ex, body) {
  body.innerHTML = `
    <div class="ex-prompt">${ex.prompt}</div>
    <div class="ex-subprompt">${ex.subprompt}</div>
    <div class="ex-options">
      ${ex.options.map((opt, i) => `
        <button class="ex-option" onclick="answerMC(${i}, '${opt.replace(/'/g, "\\'")}')">${opt}</button>
      `).join('')}
    </div>
  `;
}

function renderListening(ex, body) {
  body.innerHTML = `
    <div class="ex-prompt">${ex.prompt}</div>
    <div class="ex-subprompt">${ex.subprompt}</div>
    <button class="ex-audio-btn" id="ex-audio-btn" onclick="playWordAudio('${ex.word.word.replace(/'/g, "\\'")}')">🔊</button>
    <div class="ex-options">
      ${ex.options.map((opt, i) => `
        <button class="ex-option" onclick="answerMC(${i}, '${opt.replace(/'/g, "\\'")}')">${opt}</button>
      `).join('')}
    </div>
  `;

  // Auto-play after a short delay
  if (ex.autoPlay) {
    setTimeout(() => playWordAudio(ex.word.word), 500);
  }
}

function renderFillBlank(ex, body) {
  body.innerHTML = `
    <div class="ex-prompt small">${ex.prompt}</div>
    <div class="ex-subprompt">${ex.subprompt}</div>
    <div class="ex-options single-col">
      ${ex.options.map((opt, i) => `
        <button class="ex-option" onclick="answerMC(${i}, '${opt.replace(/'/g, "\\'")}')">${opt}</button>
      `).join('')}
    </div>
  `;
}

function answerMC(idx, selected) {
  if (exerciseAnswered) return;
  exerciseAnswered = true;

  const ex = wordExercises[currentExerciseIdx];
  const isCorrect = selected === ex.correct;
  const container = document.getElementById('ex-container');

  // Store result
  container.dataset['ex' + currentExerciseIdx + 'result'] = isCorrect ? 'correct' : 'incorrect';

  // Highlight options
  const options = document.querySelectorAll('.ex-option');
  options.forEach((opt, i) => {
    opt.disabled = true;
    if (ex.options[i] === ex.correct) {
      opt.classList.add('correct');
    }
    if (i === idx && !isCorrect) {
      opt.classList.add('incorrect');
    }
  });

  // Feedback
  const fb = document.getElementById('ex-feedback');
  if (isCorrect) {
    fb.textContent = '✅ 正确！';
    fb.className = 'ex-feedback correct';
    playSound('correct');
    sessionXP += 10;
    sessionCombo++;
    userState.todayXP = (userState.todayXP || 0) + 10;
    userState.totalXP = (userState.totalXP || 0) + 10;
    userState.todayCorrect = (userState.todayCorrect || 0) + 1;
    container.classList.add('pop');

    if (sessionCombo >= 3) {
      playSound('combo');
      fb.textContent += ' 🔥 连击 x' + sessionCombo + '!';
      sessionXP += 5;
      userState.todayXP += 5;
      userState.totalXP += 5;
      const comboEl = document.getElementById('ex-combo');
      comboEl.classList.add('fire');
      setTimeout(() => comboEl.classList.remove('fire'), 300);
    }
  } else {
    fb.textContent = '❌ 正确答案：' + ex.correct;
    fb.className = 'ex-feedback incorrect';
    playSound('incorrect');
    sessionCombo = 0;
    container.classList.add('shake');
  }

  userState.todayReviewed = (userState.todayReviewed || 0) + 1;

  // Mark dot
  const dots = document.querySelectorAll('.ex-dot');
  if (dots[currentExerciseIdx]) {
    dots[currentExerciseIdx].classList.remove('current');
    dots[currentExerciseIdx].classList.add(isCorrect ? 'done' : 'wrong');
  }

  updateTopBar();
  saveState();
  showContinue();
}

function showContinue() {
  document.getElementById('ex-continue').classList.add('show');
}

function nextExercise() {
  currentExerciseIdx++;

  if (currentExerciseIdx >= wordExercises.length) {
    showSRSRating();
  } else {
    renderExercise();
  }
}

// ═══════════════════ SRS Rating ═══════════════════
function showSRSRating() {
  const body = document.getElementById('ex-body');
  const wid = getCurrentWordId();
  const word = getWordById(wid);

  // Calculate exercise score
  const correctCount = wordExercises.filter((ex, i) => {
    const result = document.getElementById('ex-container').dataset['ex' + i + 'result'];
    if (ex.type === 'intro') return true;
    return result === 'correct';
  }).length;

  const totalExercises = wordExercises.length;
  const perfect = correctCount === totalExercises;

  document.getElementById('ex-type-label').textContent = perfect ? '🎉 完美！' : '评分';
  document.getElementById('ex-feedback').textContent = '';
  document.getElementById('ex-feedback').className = 'ex-feedback';
  document.getElementById('ex-continue').classList.remove('show');

  if (perfect) {
    playSound('complete');
    body.innerHTML = `
      <div class="lesson-complete">
        <div class="emoji">🌟</div>
        <h3>全部正确！太棒了！</h3>
        <p style="color:var(--text-secondary);margin-bottom:8px">${word.word} — ${word.translation}</p>
        <div class="xp-earned">+${(totalExercises - 1) * 10 + (sessionCombo >= 3 ? 5 : 0)} XP</div>
      </div>
    `;
  } else {
    body.innerHTML = `
      <div style="text-align:center;padding:20px">
        <div style="font-size:28px;font-weight:700;margin-bottom:8px">${word.word}</div>
        <div style="font-size:16px;color:var(--text-secondary);margin-bottom:4px">${word.phonetic}</div>
        <div style="font-size:18px;color:var(--secondary);font-weight:600;margin-bottom:16px">${word.translation}</div>
        <div style="font-size:14px;color:var(--text-secondary)">
          练习正确率：${correctCount}/${totalExercises}
        </div>
      </div>
    `;
  }

  document.getElementById('rate-buttons').classList.add('show');
}

function rateWord(quality) {
  const wid = getCurrentWordId();
  if (!wid) return;

  const prev = userState.wordProgress[wid] || { ease: 2.5, interval: 0, reps: 0, correct: 0, incorrect: 0, nextReview: null };
  const result = sm2(quality, prev.ease, prev.interval, prev.reps);

  const today = new Date();
  const nextDate = new Date(today);
  nextDate.setDate(nextDate.getDate() + result.interval);

  userState.wordProgress[wid] = {
    ease: result.ease,
    interval: result.interval,
    reps: result.reps,
    correct: prev.correct + (quality >= 2 ? 1 : 0),
    incorrect: prev.incorrect + (quality < 2 ? 1 : 0),
    nextReview: nextDate.toISOString().slice(0, 10),
    lastReviewed: todayStr()
  };

  userState.lastStudyDate = todayStr();
  userState.streak = calculateStreak();

  saveState();

  // Move to next word
  currentWordIdx++;

  const tw = userState.todayWords || [];
  if (currentWordIdx >= tw.length) {
    document.getElementById('learn-empty').style.display = '';
    document.getElementById('learn-content').style.display = 'none';
    showToast('🎉 今日任务完成！获得 ' + sessionXP + ' XP');
    updateProgressUI();
    updateHomeScreen();
  } else {
    startWordLesson();
  }
}

// ═══════════════════ Audio ═══════════════════
let bestVoice = null;

function loadVoices() {
  const voices = speechSynthesis.getVoices();
  if (voices.length === 0) return;
  const preferred = ['Samantha', 'Karen', 'Alex', 'Moira', 'Fiona'];
  for (const name of preferred) {
    bestVoice = voices.find(v => v.name === name);
    if (bestVoice) break;
  }
  if (!bestVoice) bestVoice = voices.find(v => v.lang.startsWith('en')) || voices[0];
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speakText(text, btnEl) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.85;
  utter.pitch = 1;
  if (bestVoice) utter.voice = bestVoice;

  if (btnEl) btnEl.classList.add('playing');

  utter.onend = () => {
    if (btnEl) btnEl.classList.remove('playing');
  };
  utter.onerror = () => {
    if (btnEl) btnEl.classList.remove('playing');
  };

  window.speechSynthesis.speak(utter);
}

function playWordAudio(word) {
  const btn = document.getElementById('ex-audio-btn');
  speakText(word, btn);
}

function speakPhrase(phrase) {
  speakText(phrase, null);
}

// ═══════════════════ Word Bank ═══════════════════
let wbFilter = 'all';

function setFilter(grade, el) {
  wbFilter = grade;
  document.querySelectorAll('.wb-filter').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  filterWords();
}

function filterWords() {
  const query = document.getElementById('wb-search').value.toLowerCase();
  const list = document.getElementById('wb-word-list');
  let filtered = words;

  if (wbFilter !== 'all') {
    filtered = filtered.filter(w => w.grade === parseInt(wbFilter));
  }
  if (query) {
    filtered = filtered.filter(w =>
      w.word.toLowerCase().includes(query) ||
      w.translation.includes(query)
    );
  }

  list.innerHTML = filtered.slice(0, 50).map(w => {
    const p = userState.wordProgress[w.id];
    const gradeClass = 'g' + w.grade;
    return '<div class="wb-word-item" onclick="showWordDetail(\'' + w.id + '\')">\n' +
      '  <div>\n' +
      '    <div class="wb-word-main">' + w.word + ' <span style="font-size:13px;color:var(--text-secondary)">' + w.phonetic + '</span></div>\n' +
      '    <div class="wb-word-sub">' + w.translation + '</div>\n' +
      '  </div>\n' +
      '  <span class="wb-word-grade ' + gradeClass + '">' + (w.grade === 7 ? '初一' : w.grade === 8 ? '初二' : '初三') + '</span>\n' +
      '</div>';
  }).join('');
}

// ═══════════════════ Word Detail Modal ═══════════════════
function showWordDetail(id) {
  const w = getWordById(id);
  if (!w) return;

  const p = userState.wordProgress[id];
  const status = !p || !p.reps ? '未学习' : p.reps > 3 ? '✅ 已掌握' : '📖 学习中';
  const correctPct = p && (p.correct + p.incorrect) > 0
    ? Math.round(p.correct / (p.correct + p.incorrect) * 100) + '%'
    : '--';

  let html = '<button class="modal-close" onclick="document.getElementById(\'word-modal\').classList.remove(\'show\')">✕</button>';
  html += '<h3>' + w.word + '</h3>';
  html += '<div style="font-size:15px;color:var(--text-secondary);margin-bottom:8px">' + w.phonetic + '</div>';
  html += '<div style="font-size:18px;color:var(--secondary);font-weight:600;margin-bottom:16px">' + w.translation + '</div>';
  html += '<div style="display:flex;gap:12px;margin-bottom:16px;font-size:13px;color:var(--text-secondary)">' +
    '<span>' + (w.grade === 7 ? '初一' : w.grade === 8 ? '初二' : '初三') + '</span>' +
    '<span>' + status + '</span>' +
    '<span>正确率: ' + correctPct + '</span>' +
    '</div>';
  html += '<div style="font-weight:600;margin-bottom:8px">📝 常用短语</div>';
  w.phrases.forEach(p => {
    html += '<div class="card-phrase-item" style="margin-bottom:6px">' +
      '<span><span class="phrase-en">' + p.phrase + '</span><br><span class="phrase-zh">' + p.translation + '</span></span>' +
      '<button class="audio-btn" onclick="speakPhrase(\'' + p.phrase.replace(/'/g, "\\'") + '\')">🔊</button>' +
      '</div>';
  });
  if (w.examples && w.examples.length > 0) {
    html += '<div style="font-weight:600;margin:12px 0 8px">💬 例句</div>';
    w.examples.forEach(e => {
      html += '<div style="margin-bottom:6px;font-size:14px;color:var(--text)">' + e.sentence + '</div>';
      html += '<div style="margin-bottom:10px;font-size:13px;color:var(--text-secondary)">' + e.translation + '</div>';
    });
  }

  document.getElementById('modal-card').innerHTML = html;
  document.getElementById('word-modal').classList.add('show');
}

function closeModal(e) {
  if (e.target === e.currentTarget) {
    document.getElementById('word-modal').classList.remove('show');
  }
}

// ═══════════════════ Progress & Stats ═══════════════════
function updateProgressUI() {
  const total = Object.keys(userState.wordProgress).length;
  const goal = userState.dailyGoal || 20;
  const today = userState.todayReviewed || 0;

  document.getElementById('progress-count').textContent = today + '/' + goal;

  const circumference = 452;
  const offset = circumference - (Math.min(today, goal) / goal) * circumference;
  document.getElementById('progress-circle').style.strokeDashoffset = offset;

  document.getElementById('stat-learned').textContent = total;
  document.getElementById('stat-today').textContent = today;
  document.getElementById('stat-xp').textContent = userState.totalXP || 0;

  const totalCorrect = Object.values(userState.wordProgress).reduce((s, p) => s + (p.correct || 0), 0);
  const totalAttempts = Object.values(userState.wordProgress).reduce((s, p) => s + (p.correct || 0) + (p.incorrect || 0), 0);
  document.getElementById('stat-accuracy').textContent = totalAttempts > 0
    ? Math.round(totalCorrect / totalAttempts * 100) + '%'
    : '--%';

  // Weak words
  const weak = Object.entries(userState.wordProgress)
    .filter(([_, p]) => (p.incorrect || 0) >= 3 && (p.correct || 0) < (p.incorrect || 0))
    .slice(0, 10);
  document.getElementById('weak-words-list').innerHTML = weak.map(([id]) => {
    const w = getWordById(id);
    return w ? '<div class="weak-word">' + w.word + ' — ' + w.translation + '</div>' : '';
  }).join('');
}

function updateHomeScreen() {
  const hour = new Date().getHours();
  let greet = '早上好';
  if (hour >= 12 && hour < 18) greet = '下午好';
  if (hour >= 18) greet = '晚上好';
  document.getElementById('greeting').innerHTML = greet + ' 👋<strong>开始学习吧</strong>';

  document.getElementById('xp-badge-home').textContent = '⭐ ' + (userState.totalXP || 0) + ' XP';

  const tw = userState.todayWords || [];
  const chips = document.getElementById('word-chips');
  if (tw.length === 0) {
    chips.innerHTML = '<span style="color:var(--text-secondary)">点击「开始学习」获取今日任务</span>';
  } else {
    chips.innerHTML = tw.slice(0, 10).map(id => {
      const w = getWordById(id);
      const p = userState.wordProgress[id];
      let cls = '';
      if (p && p.reps >= 3) cls = 'mastered';
      else if (p && p.reps > 0) cls = 'learning';
      return w ? '<span class="word-chip ' + cls + '">' + w.word + '</span>' : '';
    }).join('');
    if (tw.length > 10) chips.innerHTML += '<span class="word-chip">+' + (tw.length - 10) + ' 个</span>';
  }
}

// ═══════════════════ Screen Nav ═══════════════════
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

  const screenMap = {
    'home': 'home-screen',
    'learn': 'learn-screen',
    'wordbank': 'wordbank-screen',
    'stats': 'stats-screen'
  };
  const screenId = screenMap[name];
  if (screenId) document.getElementById(screenId).classList.add('active');

  const tabMap = {'home': 0, 'learn': 1, 'wordbank': 2, 'stats': 3};
  const idx = tabMap[name];
  if (idx !== undefined) document.querySelectorAll('.tab-btn')[idx].classList.add('active');

  if (name === 'stats') updateProgressUI();
  if (name === 'wordbank') filterWords();
  if (name === 'home') updateHomeScreen();
  updateStreakUI();
}

// ═══════════════════ Toast ═══════════════════
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ═══════════════════ Reset ═══════════════════
function resetAllProgress() {
  if (confirm('确定要重置所有学习数据吗？此操作不可撤销！')) {
    userState = {
      wordProgress: {},
      streak: 0,
      lastStudyDate: '',
      dailyGoal: 20,
      todayReviewed: 0,
      todayCorrect: 0,
      todayWords: [],
      totalXP: 0,
      todayXP: 0
    };
    saveState();
    updateProgressUI();
    updateHomeScreen();
    updateStreakUI();
    showToast('已重置');
  }
}

// ═══════════════════ INIT ═══════════════════
async function init() {
  try {
    const resp = await fetch('words.json');
    words = await resp.json();
  } catch(e) {
    console.error('Failed to load words.json', e);
    showToast('⚠️ 无法加载词库数据');
    return;
  }

  loadState();

  if (userState.lastStudyDate !== todayStr()) {
    userState.todayReviewed = 0;
    userState.todayCorrect = 0;
    userState.todayXP = 0;
  }

  userState.streak = calculateStreak();
  saveState();

  updateHomeScreen();
  updateStreakUI();
  updateProgressUI();

  // Resume audio context on first user gesture
  document.addEventListener('click', () => {
    try { getAudioCtx().resume(); } catch(e) {}
  }, { once: true });
}

init();
</script>
