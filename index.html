<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>词博士 — 中考英语词汇大师</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #FF6B35;
  --primary-light: #FF8C5A;
  --secondary: #004E89;
  --accent: #F7C948;
  --bg: #FAFAFA;
  --card-bg: #FFFFFF;
  --text: #1A1A2E;
  --text-secondary: #6B7280;
  --success: #10B981;
  --error: #EF4444;
  --radius: 12px;
  --radius-lg: 24px;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --safe-bottom: env(safe-area-inset-bottom, 16px);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100dvh;
}

/* Tab Bar */
.tab-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--card-bg);
  border-top: 1px solid #E5E7EB;
  display: flex; justify-content: space-around;
  padding: 8px 0 calc(8px + var(--safe-bottom));
  z-index: 100;
  box-shadow: 0 -2px 12px rgba(0,0,0,0.04);
}
.tab-btn {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: none; border: none; cursor: pointer;
  padding: 4px 16px; border-radius: 8px;
  font-family: inherit; font-size: 11px; color: var(--text-secondary);
  transition: all 150ms ease-out;
  -webkit-tap-highlight-color: transparent; min-width: 60px;
}
.tab-btn.active { color: var(--primary); font-weight: 600; }
.tab-btn .tab-icon { font-size: 22px; line-height: 1; }
.tab-btn:active { transform: scale(0.95); }

.screen { display: none; padding: 16px 16px 100px; max-width: 600px; margin: 0 auto; }
.screen.active { display: block; }

/* Home Screen */
.home-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0 16px;
}
.home-greeting { font-size: 13px; color: var(--text-secondary); }
.home-greeting strong { font-size: 20px; color: var(--text); display: block; margin-top: 2px; }
.streak-badge {
  display: flex; align-items: center; gap: 4px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white; padding: 8px 14px; border-radius: var(--radius-lg);
  font-weight: 700; font-size: 15px;
  box-shadow: 0 4px 12px rgba(255,107,53,0.3);
  animation: pulse-glow 2s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 4px 12px rgba(255,107,53,0.3); }
  50% { box-shadow: 0 4px 24px rgba(255,107,53,0.5); }
}
.xp-badge {
  display: flex; align-items: center; gap: 4px;
  background: linear-gradient(135deg, var(--accent), #FBBF24);
  color: #92400E; padding: 6px 12px; border-radius: var(--radius-lg);
  font-weight: 700; font-size: 13px; margin-top: 8px;
}
.progress-card {
  background: var(--card-bg); border-radius: var(--radius);
  padding: 24px; margin: 8px 0 16px;
  box-shadow: var(--shadow); text-align: center;
}
.progress-ring-container { position: relative; width: 160px; height: 160px; margin: 0 auto 16px; }
.progress-ring { transform: rotate(-90deg); }
.progress-ring .bg { fill: none; stroke: #E5E7EB; stroke-width: 10; }
.progress-ring .fill { fill: none; stroke: var(--primary); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 600ms ease-out; }
.progress-center {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center;
}
.progress-center .count { font-size: 32px; font-weight: 700; color: var(--primary); }
.progress-center .label { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.cta-btn {
  display: block; width: 100%; padding: 16px; border: none;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white; font-size: 18px; font-weight: 700; border-radius: var(--radius);
  cursor: pointer; font-family: inherit;
  box-shadow: 0 4px 16px rgba(255,107,53,0.35);
  transition: all 150ms ease-out;
  -webkit-tap-highlight-color: transparent;
}
.cta-btn:active { transform: scale(0.97); opacity: 0.9; }
.today-preview { margin-top: 20px; }
.today-preview h3 { font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.today-preview h3::before { content: '📚'; }
.word-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.word-chip {
  background: var(--card-bg); border: 1px solid #E5E7EB;
  padding: 6px 14px; border-radius: var(--radius-lg);
  font-size: 14px; font-weight: 500; cursor: pointer;
  transition: all 150ms ease-out;
}
.word-chip.mastered { background: #D1FAE5; border-color: var(--success); color: #065F46; }
.word-chip.learning { background: #FEF3C7; border-color: var(--accent); color: #92400E; }

/* ═══════════ LEARN SCREEN ═══════════ */
.learn-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px;
}
.learn-header .back-btn {
  background: var(--card-bg); border: 1px solid #E5E7EB;
  padding: 8px 16px; border-radius: var(--radius);
  cursor: pointer; font-family: inherit; font-size: 14px;
  color: var(--text-secondary);
  -webkit-tap-highlight-color: transparent;
}
.learn-header .queue-info { font-size: 13px; color: var(--text-secondary); }

/* Top bar */
.ex-topbar {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 8px; padding: 8px 14px;
  background: var(--card-bg); border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.ex-xp { font-weight: 700; font-size: 15px; color: #92400E; }
.ex-combo {
  font-weight: 700; font-size: 14px; color: var(--primary);
  margin-left: auto; display: none;
}
.ex-combo.show { display: flex; align-items: center; gap: 4px; }
.ex-combo.fire { animation: combo-pop 300ms ease-out; color: #DC2626; }
@keyframes combo-pop {
  0% { transform: scale(1); } 50% { transform: scale(1.4); } 100% { transform: scale(1); }
}
.ex-hearts { display: flex; gap: 4px; margin-left: auto; }
.ex-heart { font-size: 18px; transition: all 300ms; }
.ex-heart.lost { filter: grayscale(1); opacity: 0.3; transform: scale(0.8); }
.ex-heart.pulse { animation: heart-pulse 200ms ease-out; }
@keyframes heart-pulse {
  0% { transform: scale(1.5); } 100% { transform: scale(1); }
}

/* ═══════════ MASCOT ═══════════ */
.mascot-area {
  display: flex; align-items: flex-start; gap: 10px;
  margin-bottom: 12px; min-height: 64px;
}
.mascot {
  flex-shrink: 0; width: 56px; height: 56px;
  border-radius: 50%; position: relative;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; transition: all 300ms ease-out;
}
.mascot.happy { background: linear-gradient(135deg, #FEF3C7, #FDE68A); animation: mascot-bounce 600ms ease-out; }
.mascot.think { background: linear-gradient(135deg, #DBEAFE, #BFDBFE); }
.mascot.celebrate { background: linear-gradient(135deg, #D1FAE5, #A7F3D0); animation: mascot-spin 500ms ease-out; }
.mascot.encourage { background: linear-gradient(135deg, #FEE2E2, #FECACA); animation: mascot-nod 400ms ease-out; }
.mascot.idle { background: linear-gradient(135deg, #F3F4F6, #E5E7EB); }
@keyframes mascot-bounce {
  0% { transform: translateY(0); } 40% { transform: translateY(-12px); } 60% { transform: translateY(-4px); } 100% { transform: translateY(0); }
}
@keyframes mascot-spin {
  0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(15deg) scale(1.15); } 100% { transform: rotate(0deg) scale(1); }
}
@keyframes mascot-nod {
  0% { transform: rotate(0deg); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } 100% { transform: rotate(0deg); }
}
.mascot-speech {
  flex: 1; background: var(--card-bg); border-radius: 16px;
  padding: 10px 14px; box-shadow: var(--shadow);
  font-size: 14px; font-weight: 500; line-height: 1.5;
  position: relative; align-self: center;
}
.mascot-speech::before {
  content: ''; position: absolute; left: -8px; top: 50%; transform: translateY(-50%);
  border: 8px solid transparent; border-right-color: var(--card-bg);
}

/* Exercise container */
.ex-container {
  background: var(--card-bg); border-radius: var(--radius);
  padding: 20px; box-shadow: var(--shadow);
  min-height: 280px; display: flex; flex-direction: column;
  transition: all 200ms;
}
.ex-container.shake { animation: ex-shake 400ms ease-out; }
.ex-container.pop { animation: ex-pop 300ms ease-out; }
@keyframes ex-shake {
  0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); }
}
@keyframes ex-pop {
  0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); }
}

.ex-type-badge {
  display: inline-block; padding: 4px 10px; border-radius: 12px;
  font-size: 11px; font-weight: 600; margin-bottom: 12px;
  letter-spacing: 0.5px;
}
.ex-type-badge.translate { background: #DBEAFE; color: #1E40AF; }
.ex-type-badge.listening { background: #FEF3C7; color: #92400E; }
.ex-type-badge.fill { background: #D1FAE5; color: #065F46; }
.ex-type-badge.match { background: #F3E8FF; color: #6B21A8; }

.ex-prompt {
  font-size: 26px; font-weight: 700; color: var(--text);
  text-align: center; margin-bottom: 6px; word-break: break-word;
}
.ex-prompt.small { font-size: 20px; }
.ex-prompt.big { font-size: 34px; }
.ex-subprompt {
  font-size: 14px; color: var(--text-secondary);
  text-align: center; margin-bottom: 16px;
}

.ex-audio-btn {
  display: block; margin: 0 auto 12px; width: 52px; height: 52px;
  border-radius: 50%; border: 3px solid var(--primary);
  background: var(--card-bg); cursor: pointer; font-size: 26px;
  transition: all 150ms; -webkit-tap-highlight-color: transparent;
}
.ex-audio-btn:active { transform: scale(1.1); background: #FFF7F0; }
.ex-audio-btn.playing { animation: audio-pulse 0.8s ease-in-out infinite; background: #FFF7F0; }
@keyframes audio-pulse {
  0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); box-shadow: 0 0 0 8px rgba(255,107,53,0.15); }
}

/* Option buttons */
.ex-options {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; margin-top: auto;
}
.ex-options.single-col { grid-template-columns: 1fr; }
.ex-option {
  padding: 14px 12px; border: 2px solid #E5E7EB;
  border-radius: var(--radius); background: var(--card-bg);
  cursor: pointer; font-family: inherit; font-size: 15px;
  font-weight: 600; text-align: center;
  transition: all 150ms ease-out;
  -webkit-tap-highlight-color: transparent;
  word-break: break-word; min-height: 52px;
  display: flex; align-items: center; justify-content: center;
}
.ex-option:active { transform: scale(0.96); }
.ex-option.correct {
  background: #D1FAE5; border-color: var(--success); color: #065F46;
  animation: option-correct 400ms ease-out;
}
.ex-option.incorrect {
  background: #FEE2E2; border-color: var(--error); color: #991B1B;
  animation: option-incorrect 400ms ease-out;
}
.ex-option.reveal {
  background: #D1FAE5; border-color: var(--success); color: #065F46;
  border-style: dashed;
}
.ex-option:disabled { pointer-events: none; }
.ex-option.wrong-opt { opacity: 0.5; }
@keyframes option-correct {
  0% { transform: scale(1); } 40% { transform: scale(1.05); } 100% { transform: scale(1); }
}
@keyframes option-incorrect {
  0% { transform: translateX(0); } 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } 100% { transform: translateX(0); }
}

/* Feedback bar */
.ex-feedback {
  text-align: center; margin-top: 12px; font-weight: 700; font-size: 16px;
  min-height: 24px; transition: all 200ms;
}
.ex-feedback.good { color: var(--success); }
.ex-feedback.bad { color: var(--error); }

/* Progress dots */
.ex-progress-dots { display: flex; gap: 6px; align-items: center; }
.ex-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #E5E7EB; transition: all 200ms;
}
.ex-dot.done { background: var(--success); }
.ex-dot.current { background: var(--primary); transform: scale(1.4); }
.ex-dot.wrong { background: var(--error); }

/* Intro card */
.ex-intro-card { text-align: center; }
.ex-intro-word { font-size: 42px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.ex-intro-phonetic { font-size: 17px; color: var(--text-secondary); margin-bottom: 8px; }
.ex-intro-trans { font-size: 20px; color: var(--secondary); font-weight: 600; margin-bottom: 4px; }
.ex-intro-phrase-row {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; margin: 6px 0; font-size: 14px;
  background: #F3F4F6; padding: 8px 14px; border-radius: 8px;
}
.ex-intro-phrase-row .phr-en { font-weight: 500; }
.ex-intro-phrase-row .phr-zh { color: var(--text-secondary); font-size: 12px; }
.ex-intro-start {
  width: 100%; padding: 14px; border: none; margin-top: 16px;
  background: linear-gradient(135deg, #10B981, #059669);
  color: white; font-size: 17px; font-weight: 700;
  border-radius: var(--radius); cursor: pointer; font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}
.ex-intro-start:active { opacity: 0.9; transform: scale(0.98); }

/* Rate buttons */
.rate-section { display: none; margin-top: 12px; }
.rate-section.show { display: block; }
.rate-section h4 { text-align: center; font-size: 14px; color: var(--text-secondary); margin-bottom: 10px; }
.rate-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate-btn {
  padding: 12px 8px; border: 2px solid #E5E7EB;
  border-radius: var(--radius); background: var(--card-bg);
  cursor: pointer; font-family: inherit; font-size: 13px;
  font-weight: 600; transition: all 150ms ease-out;
  -webkit-tap-highlight-color: transparent;
}
.rate-btn:active { transform: scale(0.95); }
.rate-btn.again { color: var(--error); }
.rate-btn.hard { color: var(--accent); }
.rate-btn.good { color: var(--secondary); }
.rate-btn.easy { color: var(--success); }
.rate-btn:active.again { background: #FEE2E2; border-color: var(--error); }
.rate-btn:active.hard { background: #FEF3C7; border-color: var(--accent); }
.rate-btn:active.good { background: #DBEAFE; border-color: var(--secondary); }
.rate-btn:active.easy { background: #D1FAE5; border-color: var(--success); }

/* Word summary (post-exercise, pre-rating) */
.word-summary {
  text-align: center; padding: 16px 0;
}
.word-summary .big-word { font-size: 32px; font-weight: 700; }
.word-summary .big-trans { font-size: 18px; color: var(--secondary); font-weight: 600; margin: 4px 0; }
.word-summary .result-stats { font-size: 14px; color: var(--text-secondary); margin: 8px 0; }
.word-summary .perfect-badge {
  display: inline-block; padding: 6px 16px;
  background: linear-gradient(135deg, #10B981, #34D399);
  color: white; border-radius: var(--radius-lg);
  font-weight: 700; font-size: 15px; animation: bounce-in 500ms ease-out;
}
@keyframes bounce-in {
  0% { transform: scale(0); } 60% { transform: scale(1.15); } 100% { transform: scale(1); }
}

/* Learn empty */
.learn-empty { text-align: center; padding: 40px 20px; }
.learn-empty .emoji { font-size: 64px; margin-bottom: 16px; }
.learn-empty h2 { font-size: 20px; color: var(--text); margin-bottom: 8px; }
.learn-empty p { color: var(--text-secondary); margin-bottom: 8px; }

/* Word Bank */
.wb-search {
  width: 100%; padding: 12px 16px; border: 2px solid #E5E7EB;
  border-radius: var(--radius); font-size: 16px; font-family: inherit;
  margin-bottom: 16px; outline: none; transition: border-color 150ms;
}
.wb-search:focus { border-color: var(--primary); }
.wb-filters { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; }
.wb-filter {
  padding: 8px 16px; border: 2px solid #E5E7EB;
  border-radius: var(--radius-lg); background: var(--card-bg);
  font-size: 13px; font-weight: 600; cursor: pointer;
  font-family: inherit; white-space: nowrap;
  transition: all 150ms ease-out;
}
.wb-filter.active { background: var(--primary); color: white; border-color: var(--primary); }
.wb-word-item {
  background: var(--card-bg); padding: 14px 16px;
  border-radius: var(--radius); margin-bottom: 8px;
  box-shadow: var(--shadow); cursor: pointer;
  transition: all 150ms ease-out;
  display: flex; justify-content: space-between; align-items: center;
}
.wb-word-item:active { transform: scale(0.98); }
.wb-word-main { font-size: 17px; font-weight: 600; }
.wb-word-sub { font-size: 13px; color: var(--text-secondary); }
.wb-word-grade {
  font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: 600;
}
.wb-word-grade.g7 { background: #DBEAFE; color: var(--secondary); }
.wb-word-grade.g8 { background: #FEF3C7; color: #92400E; }
.wb-word-grade.g9 { background: #FEE2E2; color: #991B1B; }

/* Modal */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.5); z-index: 200;
  align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal-card {
  background: var(--card-bg); border-radius: var(--radius);
  padding: 24px; max-width: 400px; width: 100%;
  max-height: 80vh; overflow-y: auto; box-shadow: var(--shadow-lg);
}
.modal-close {
  float: right; background: none; border: none;
  font-size: 24px; cursor: pointer; color: var(--text-secondary);
  padding: 4px 8px; border-radius: 8px;
}
.modal-card h3 { font-size: 28px; margin-bottom: 4px; }

/* Stats */
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
.stat-item {
  background: var(--card-bg); padding: 16px; border-radius: var(--radius);
  box-shadow: var(--shadow); text-align: center;
}
.stat-value { font-size: 28px; font-weight: 700; color: var(--primary); }
.stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

/* Ebbinghaus Curve */
.ebbinghaus-card {
  background: var(--card-bg); border-radius: var(--radius);
  padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow);
}
.ebbinghaus-card h3 { font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.ebbinghaus-chart { width: 100%; height: 120px; }
.ebbinghaus-stages { display: flex; gap: 4px; margin-top: 10px; font-size: 11px; }
.eb-stage {
  flex: 1; text-align: center; padding: 4px 0; border-radius: 6px;
  font-weight: 600; color: var(--text-secondary); background: #F3F4F6;
  transition: all 200ms;
}
.eb-stage.has-words { background: #DBEAFE; color: #1E40AF; }
.eb-stage.current { background: var(--primary); color: white; animation: pulse-glow 2s ease-in-out infinite; }
.eb-stage.done { background: #D1FAE5; color: #065F46; }

.weak-words { margin-top: 20px; }
.weak-words h3 { font-size: 16px; margin-bottom: 12px; }
.weak-word {
  background: var(--card-bg); padding: 10px 14px;
  border-left: 4px solid var(--error); border-radius: 0 8px 8px 0;
  margin-bottom: 8px; box-shadow: var(--shadow); font-size: 14px;
}

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: white; padding: 12px 24px;
  border-radius: var(--radius-lg); font-weight: 600;
  z-index: 300; opacity: 0; transition: opacity 200ms; pointer-events: none;
}
.toast.show { opacity: 1; }

/* XP float animation */
.xp-float {
  position: fixed; font-weight: 700; font-size: 18px;
  pointer-events: none; z-index: 250;
  animation: xp-rise 1s ease-out forwards;
}
@keyframes xp-rise {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
}

/* Confetti */
.confetti-piece {
  position: fixed; pointer-events: none; z-index: 250;
  font-size: 20px; animation: confetti-fall 1.5s ease-out forwards;
}
@keyframes confetti-fall {
  0% { opacity: 1; transform: translateY(0) rotate(0deg); }
  100% { opacity: 0; transform: translateY(300px) rotate(720deg); }
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- ═══════════ HOME SCREEN ═══════════ -->
<div class="screen active" id="home-screen">
  <div class="home-header">
    <div>
      <div class="home-greeting" id="greeting">加载中...</div>
      <div class="xp-badge" id="xp-badge-home">⭐ 0 XP</div>
    </div>
    <div class="streak-badge" id="streak-badge">🔥 0 天</div>
  </div>
  <div class="progress-card">
    <div class="progress-ring-container">
      <svg class="progress-ring" width="160" height="160" viewBox="0 0 160 160">
        <circle class="bg" cx="80" cy="80" r="72"/>

<script>
// ═══════════════════ DATA & STATE ═══════════════════
let words = [];
let corePhrases = [];
let userState = {
  wordProgress: {},
  streak: 0,
  lastStudyDate: '',
  dailyGoal: 20,
  todayReviewed: 0,
  todayCorrect: 0,
  todayWords: [],
  totalXP: 0,
  todayXP: 0
};
const DAILY_REVIEW_LIMIT = 20;

function loadState() {
  try {
    const raw = localStorage.getItem('vocab-master-state');
    if (raw) { const p = JSON.parse(raw); userState = { ...userState, ...p }; }
  } catch(e) {}
}
function saveState() {
  localStorage.setItem('vocab-master-state', JSON.stringify(userState));
}

// ═══════════════════ Ebbinghaus Anti-Forgetting Curve ═══════════════════
// Intervals: 1d → 2d → 4d → 7d → 15d → 30d → 60d (mastered)
const EBBINGHAUS_INTERVALS = [1, 2, 4, 7, 15, 30, 60];
const EBBINGHAUS_STAGE_NAMES = [
  '初次学习', '1天后复习', '2天后复习', '4天后复习',
  '7天后复习', '15天后复习', '30天后复习', '已掌握 ✓'
];

function ebbinghausSchedule(currentStage, quality) {
  // quality: 0=again, 1=hard, 2=good, 3=easy
  let nextStage, interval;
  if (quality <= 1) {
    // Again/Hard: reset to stage 1 (review tomorrow)
    nextStage = 1;
    interval = 1;
  } else if (quality === 3) {
    // Easy: skip ahead 2 stages
    nextStage = Math.min(currentStage + 2, EBBINGHAUS_INTERVALS.length);
    interval = EBBINGHAUS_INTERVALS[Math.min(nextStage, EBBINGHAUS_INTERVALS.length - 1)];
  } else {
    // Good: advance one stage
    nextStage = Math.min(currentStage + 1, EBBINGHAUS_INTERVALS.length);
    interval = EBBINGHAUS_INTERVALS[Math.min(nextStage - 1, EBBINGHAUS_INTERVALS.length - 1)];
  }
  return { stage: nextStage, interval };
}

// ═══════════════════ DAILY QUEUE ═══════════════════
function todayStr() { return new Date().toISOString().slice(0, 10); }

function getDueWords() {
  const today = todayStr();
  const due = [];
  const shuffled = [...words.map(w => w.id)].sort(() => Math.random() - 0.5);
  for (const id of shuffled) {
    const p = userState.wordProgress[id];
    if (!p || !p.nextReview || p.nextReview <= today) due.push(id);
  }
  return due.slice(0, Math.max(DAILY_REVIEW_LIMIT, due.length));
}

function getTodayWords() {
  let tw = userState.todayWords || [];
  if (userState.lastStudyDate !== todayStr()) tw = [];
  if (tw.length === 0) tw = getDueWords();
  return tw;
}

function startLearning() {
  userState.todayWords = getTodayWords();
  userState.lastStudyDate = todayStr();
  userState.streak = calculateStreak();
  updateStreakForToday();
  saveState();
  if (userState.todayWords.length === 0) {
    userState.todayWords = words.map(w => w.id).sort(() => Math.random() - 0.5);
    saveState();
  }
  showScreen('learn');
  currentWordIdx = 0;
  startWordLesson();
}

function resetDailyQueue() {
  userState.todayWords = getDueWords();
  if (userState.todayWords.length === 0) userState.todayWords = words.map(w => w.id).sort(() => Math.random() - 0.5);
  saveState();
  currentWordIdx = 0;
  document.getElementById('learn-empty').style.display = 'none';
  document.getElementById('learn-content').style.display = '';
  startWordLesson();
}

// ═══════════════════ STREAK ═══════════════════
function calculateStreak() {
  let streak = userState.streak || 0;
  const today = new Date();
  const last = userState.lastStudyDate ? new Date(userState.lastStudyDate) : null;
  if (!last) return 1;
  const diff = Math.floor((today - last) / 86400000);
  if (diff === 0) return streak;
  if (diff === 1) return streak + 1;
  return 1;
}
function updateStreakForToday() {
  userState.streak = calculateStreak();
  userState.lastStudyDate = todayStr();
  saveState();
  updateStreakUI();
}
function updateStreakUI() {
  const s = userState.streak || 0;
  document.getElementById('streak-badge').textContent = '🔥 ' + s + ' 天';
  document.getElementById('stat-streak').textContent = s + ' 天';
}

// ═══════════════════ SOUNDS ═══════════════════
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playSound(type) {
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    if (type === 'correct') {
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine'; o.frequency.setValueAtTime(523, now); o.frequency.setValueAtTime(659, now + 0.07);
      g.gain.setValueAtTime(0.25, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      o.start(now); o.stop(now + 0.2);
    } else if (type === 'incorrect') {
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'square'; o.frequency.setValueAtTime(180, now);
      g.gain.setValueAtTime(0.12, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      o.start(now); o.stop(now + 0.3);
    } else if (type === 'combo') {
      [660, 880, 1100].forEach((f, i) => {
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine'; o.frequency.setValueAtTime(f, now + i * 0.04);
        g.gain.setValueAtTime(0.2, now + i * 0.04);
        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.04 + 0.25);
        o.start(now + i * 0.04); o.stop(now + i * 0.04 + 0.25);
      });
    } else if (type === 'perfect') {
      [523, 659, 784, 1047].forEach((f, i) => {
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine'; o.frequency.setValueAtTime(f, now + i * 0.1);
        g.gain.setValueAtTime(0.2, now + i * 0.1);
        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.3);
        o.start(now + i * 0.1); o.stop(now + i * 0.1 + 0.3);
      });
    }
  } catch(e) {}
}

// ═══════════════════ MASCOT ═══════════════════
const MASCOT_EMOJI = { happy: '🦉', think: '🤔', celebrate: '🎉', encourage: '💪', idle: '🦉' };
const MASCOT_CLASS = { happy: 'happy', think: 'think', celebrate: 'celebrate', encourage: 'encourage', idle: 'idle' };

const MASCOT_MSGS = {
  intro: ['来看看这个单词 👀', '新单词来啦！', '认识这个词吗？', '准备好了吗？😊'],
  quiz: ['选哪个呢？', '好好想想～', '这个你肯定认识！', '仔细看哦 👀', '回忆一下…'],
  correct: ['太棒了！🎉', '答对了！', '厉害！', '完美！', '你是天才！🌟', '继续保持！', '轻轻松松～'],
  incorrect: ['没关系，记住它！💪', '下次一定对！', '别灰心～', '记住了吗？再来！', '这个有点难呢'],
  allCorrect: ['全部正确！你是词汇大师！🏆', '完美通关！太厉害了！🌟', '满分！词博士为你骄傲！🎓'],
  someWrong: ['还有进步空间，加油！💪', '不错哦，继续努力！', '多练练就记住了～'],
  rate: ['这个单词你记住了吗？', '诚实评价哦～', '感觉怎么样？']
};

function setMascot(mood, msg) {
  const m = document.getElementById('mascot');
  const s = document.getElementById('mascot-speech');
  // Pick message
  let text = msg;
  if (Array.isArray(msg)) text = msg[Math.floor(Math.random() * msg.length)];
  // Update
  m.className = 'mascot ' + MASCOT_CLASS[mood];
  m.textContent = MASCOT_EMOJI[mood];
  s.textContent = text;
}

// ═══════════════════ EXERCISE SYSTEM ═══════════════════
let currentWordIdx = 0;
let currentExerciseIdx = 0;
let exerciseAnswered = false;
let sessionXP = 0;
let sessionCombo = 0;
let sessionHearts = 3;
let wordExercises = [];
let wordCorrectCount = 0;
let wordWrongCount = 0;

function getWordById(id) { return words.find(w => w.id === id); }
function getCurrentWordId() {
  const tw = userState.todayWords || [];
  return currentWordIdx < tw.length ? tw[currentWordIdx] : null;
}

// Shuffle array
function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// Pick N random distractors
function getDistractors(word, count, field) {
  const others = words.filter(w => w.id !== word.id);
  const sameGrade = others.filter(w => w.grade === word.grade);
  const pool = sameGrade.length >= count ? sameGrade : others;
  return shuffle(pool).slice(0, count).map(w => w[field]);
}

// ═══════════ BUILD RANDOMIZED EXERCISES ═══════════
function generateExercises(word) {
  // Always starts with intro, then 5 randomized exercises
  const exercises = [{ type: 'intro', word }];

  // Pool of exercise generators (excluding intro)
  const pool = [];

  // MC: EN word → ZH meaning
  pool.push(() => {
    const opts = shuffle([word.translation, ...getDistractors(word, 3, 'translation')]);
    return {
      type: 'mc_enzh', word,
      badge: '英 → 中', badgeClass: 'translate',
      prompt: word.word,
      subprompt: '这个词的中文意思是？',
      options: opts, correct: word.translation
    };
  });

  // MC: ZH meaning → EN word
  pool.push(() => {
    const opts = shuffle([word.word, ...getDistractors(word, 3, 'word')]);
    return {
      type: 'mc_zhen', word,
      badge: '中 → 英', badgeClass: 'translate',
      prompt: word.translation,
      subprompt: '对应的英文单词是？',
      options: opts, correct: word.word
    };
  });

  // Listening: hear word → pick it
  pool.push(() => {
    const opts = shuffle([word.word, ...getDistractors(word, 3, 'word')]);
    return {
      type: 'listening', word,
      badge: '听力', badgeClass: 'listening',
      prompt: '🔊 听到的是哪个单词？',
      subprompt: '点击喇叭听发音',
      options: opts, correct: word.word, autoPlay: true
    };
  });

  // Fill blank: sentence with gap
  if (word.examples && word.examples.length > 0) {
    pool.push(() => {
      const ex = word.examples[Math.floor(Math.random() * word.examples.length)];
      const blank = ex.sentence.replace(new RegExp(word.word, 'gi'), '_____');
      const opts = shuffle([word.word, ...getDistractors(word, 3, 'word')]);
      return {
        type: 'fill_blank', word,
        badge: '完形填空', badgeClass: 'fill',
        prompt: blank,
        subprompt: ex.translation,
        options: opts, correct: word.word
      };
    });
  }

  // Phrase EN → ZH
  if (word.phrases.length > 0) {
    const phrase = word.phrases[Math.floor(Math.random() * word.phrases.length)];
    const otherPhrases = words
      .filter(w => w.id !== word.id && w.phrases.length > 0)
      .flatMap(w => w.phrases.map(p => p.translation));
    const distractorPhrases = shuffle([...new Set(otherPhrases)]).slice(0, 3);
    pool.push(() => {
      const opts = shuffle([phrase.translation, ...distractorPhrases]);
      return {
        type: 'phrase_enzh', word,
        badge: '短语英→中', badgeClass: 'match',
        prompt: '"' + phrase.phrase + '"',
        subprompt: '这个短语的意思是？',
        options: opts, correct: phrase.translation
      };
    });

    // Phrase ZH → EN
    const otherEnPhrases = words
      .filter(w => w.id !== word.id && w.phrases.length > 0)
      .flatMap(w => w.phrases.map(p => p.phrase));
    const distractorEn = shuffle([...new Set(otherEnPhrases)]).slice(0, 3);
    pool.push(() => {
      const opts = shuffle([phrase.phrase, ...distractorEn]);
      return {
        type: 'phrase_zhen', word,
        badge: '短语中→英', badgeClass: 'match',
        prompt: '"' + phrase.translation + '"',
        subprompt: '对应的英文短语是？',
        options: opts, correct: phrase.phrase
      };
    });
  }

  // Select 5 exercises from pool (or all if pool is small)
  const selectedCount = Math.min(5, pool.length);
  const selected = shuffle(pool).slice(0, selectedCount);
  for (const gen of selected) {
    exercises.push(gen());
  }

  return exercises;
}

// ═══════════ START WORD LESSON ═══════════
function startWordLesson() {
  const wid = getCurrentWordId();
  if (!wid) {
    document.getElementById('learn-empty').style.display = '';
    document.getElementById('learn-content').style.display = 'none';
    return;
  }

  document.getElementById('learn-empty').style.display = 'none';
  document.getElementById('learn-content').style.display = '';
  document.getElementById('rate-section').classList.remove('show');

  const word = getWordById(wid);
  if (!word) { currentWordIdx++; startWordLesson(); return; }

  wordExercises = generateExercises(word);
  currentExerciseIdx = 0;
  exerciseAnswered = false;
  wordCorrectCount = 0;
  wordWrongCount = 0;

  updateQueueInfo();
  renderDots();
  updateTopBar();
  setMascot('idle', MASCOT_MSGS.intro);
  renderExercise();
}

function updateQueueInfo() {
  document.getElementById('queue-info').textContent = (currentWordIdx + 1) + ' / ' + (userState.todayWords || []).length;
}

function renderDots() {
  const dotsEl = document.getElementById('ex-dots');
  dotsEl.innerHTML = wordExercises.map((_, i) => {
    let cls = 'ex-dot';
    if (i < currentExerciseIdx) cls += ' done';
    if (i === currentExerciseIdx) cls += ' current';
    return '<span class="' + cls + '"></span>';
  }).join('');
}

function updateTopBar() {
  document.getElementById('ex-xp').textContent = '⭐ ' + sessionXP;
  const combo = document.getElementById('ex-combo');
  if (sessionCombo >= 3) {
    combo.classList.add('show');
    combo.textContent = '🔥 x' + sessionCombo;
  } else {
    combo.classList.remove('show');
  }

  // Hearts
  const heartsEl = document.getElementById('ex-hearts');
  heartsEl.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const h = document.createElement('span');
    h.className = 'ex-heart';
    h.textContent = i < sessionHearts ? '❤️' : '🤍';
    if (i >= sessionHearts) h.classList.add('lost');
    heartsEl.appendChild(h);
  }
}

// ═══════════ RENDER EXERCISE ═══════════
function renderExercise() {
  if (currentExerciseIdx >= wordExercises.length) {
    showWordSummary();
    return;
  }

  exerciseAnswered = false;
  const ex = wordExercises[currentExerciseIdx];
  document.getElementById('ex-feedback').textContent = '';
  document.getElementById('ex-feedback').className = 'ex-feedback';
  document.getElementById('ex-container').classList.remove('shake', 'pop');
  document.getElementById('rate-section').classList.remove('show');
  renderDots();

  if (ex.type === 'intro') {
    const w = ex.word;
    const p = userState.wordProgress[w.id];
    const stage = p ? (p.stage || 0) : 0;
    const stageMsg = stage > 0 ? ' (第' + stage + '次复习)' : ' (初次学习)';
    setMascot('happy', '来看看这个单词 👀' + stageMsg);
    renderIntro(ex);
  } else {
    setMascot('think', MASCOT_MSGS.quiz);
    renderQuiz(ex);
  }
}

function renderIntro(ex) {
  const w = ex.word;
  document.getElementById('ex-body').innerHTML = `
    <div class="ex-intro-card">
      <div class="ex-intro-word">${w.word}</div>
      <div class="ex-intro-phonetic">${w.phonetic}</div>

        <div class="ex-intro-phrase-row">
          <span class="phr-en">${p.phrase}</span>
          <span>—</span>
          <span class="phr-zh">${p.translation}</span>

function startQuizRound() {
  currentExerciseIdx++;
  renderExercise();
}

function renderQuiz(ex) {
  const body = document.getElementById('ex-body');
  const badgeHTML = ex.badge ? '<span class="ex-type-badge ' + ex.badgeClass + '">' + ex.badge + '</span>' : '';

  body.innerHTML = badgeHTML + `
    <div class="ex-prompt${ex.prompt.length > 20 ? ' small' : ex.prompt.length < 8 ? ' big' : ''}">${ex.prompt}</div>
    <div class="ex-subprompt">${ex.subprompt || ''}</div>
    ${ex.type === 'listening' ? '<button class="ex-audio-btn" id="ex-audio-btn" onclick="playWordAudio(\'' + ex.word.word.replace(/'/g, "\\'") + '\')">🔊</button>' : ''}

      ${ex.options.map((opt, i) => `
        <button class="ex-option" onclick="answerQuiz(${i})">${opt}</button>
      `).join('')}
    </div>`;

  if (ex.autoPlay) setTimeout(() => playWordAudio(ex.word.word), 500);
}

// ═══════════ ANSWER QUIZ ═══════════
function answerQuiz(idx) {
  if (exerciseAnswered) return;
  exerciseAnswered = true;

  const ex = wordExercises[currentExerciseIdx];
  const selected = ex.options[idx];
  const isCorrect = selected === ex.correct;

  // Highlight
  const optionEls = document.querySelectorAll('.ex-option');
  optionEls.forEach((el, i) => {
    el.disabled = true;
    if (ex.options[i] === ex.correct) el.classList.add('correct');
    if (i === idx && !isCorrect) el.classList.add('incorrect');
  });

  const fb = document.getElementById('ex-feedback');
  const container = document.getElementById('ex-container');

  if (isCorrect) {
    fb.textContent = '✅ 正确！';
    fb.className = 'ex-feedback good';
    playSound('correct');
    sessionXP += 10;
    sessionCombo++;
    wordCorrectCount++;
    userState.todayXP = (userState.todayXP || 0) + 10;
    userState.totalXP = (userState.totalXP || 0) + 10;
    userState.todayCorrect = (userState.todayCorrect || 0) + 1;
    container.classList.add('pop');
    setMascot('happy', MASCOT_MSGS.correct);
    floatXP('+10');

    if (sessionCombo >= 3) {
      playSound('combo');
      fb.textContent += ' 🔥 连击 x' + sessionCombo + '!';
      sessionXP += 5;
      userState.todayXP += 5;
      userState.totalXP += 5;
      document.getElementById('ex-combo').classList.add('fire');
      setTimeout(() => document.getElementById('ex-combo').classList.remove('fire'), 300);
      floatXP('+5');
    }
  } else {
    fb.textContent = '❌ 正确答案：' + ex.correct;
    fb.className = 'ex-feedback bad';
    playSound('incorrect');
    sessionCombo = 0;
    wordWrongCount++;
    sessionHearts = Math.max(0, sessionHearts - 1);
    container.classList.add('shake');
    setMascot('encourage', MASCOT_MSGS.incorrect);

    // Mark dot wrong
    const dots = document.querySelectorAll('.ex-dot');
    if (dots[currentExerciseIdx]) dots[currentExerciseIdx].classList.add('wrong');
  }

  userState.todayReviewed = (userState.todayReviewed || 0) + 1;
  updateTopBar();
  saveState();

  // Auto-advance after delay
  const delay = isCorrect ? 1000 : 1600;
  setTimeout(() => {
    currentExerciseIdx++;
    if (currentExerciseIdx >= wordExercises.length) {
      showWordSummary();
    } else {
      renderExercise();
    }
  }, delay);
}

// ═══════════ WORD SUMMARY + RATING ═══════════
function showWordSummary() {
  const word = getWordById(getCurrentWordId());
  const total = wordExercises.length - 1; // exclude intro
  const perfect = wordCorrectCount === total;

  document.getElementById('ex-feedback').textContent = '';
  document.getElementById('ex-feedback').className = 'ex-feedback';

  if (perfect) {
    playSound('perfect');
    setMascot('celebrate', MASCOT_MSGS.allCorrect);
    spawnConfetti();
  } else {
    setMascot('encourage', MASCOT_MSGS.someWrong);
  }

  document.getElementById('ex-body').innerHTML = `
    <div class="word-summary">
      ${perfect ? '<div class="perfect-badge">🌟 全部正确！</div>' : ''}
      <div class="big-word" style="margin-top:12px">${word.word}</div>
      <div style="font-size:15px;color:var(--text-secondary)">${word.phonetic}</div>
      <div class="big-trans">${word.translation}</div>
      <div class="result-stats">
        ${wordCorrectCount}/${total} 正确
        ${wordWrongCount > 0 ? ' · ' + wordWrongCount + ' 错误' : ''}
        · 第${(userState.wordProgress[getCurrentWordId()]?.stage || 0) + 1}次学习
      </div>
    </div>`;

  document.getElementById('rate-section').classList.add('show');
}

function rateWord(quality) {
  const wid = getCurrentWordId();
  if (!wid) return;

  const prev = userState.wordProgress[wid] || { stage: 0, interval: 0, correct: 0, incorrect: 0, nextReview: null, lastReviewed: null };
  const currentStage = prev.stage || 0;
  const result = ebbinghausSchedule(currentStage, quality);

  const today = new Date();
  const nextDate = new Date(today);
  nextDate.setDate(nextDate.getDate() + result.interval);

  userState.wordProgress[wid] = {
    stage: result.stage,
    interval: result.interval,
    correct: prev.correct + (quality >= 2 ? 1 : 0),
    incorrect: prev.incorrect + (quality < 2 ? 1 : 0),
    nextReview: nextDate.toISOString().slice(0, 10),
    lastReviewed: todayStr(),
    firstStudied: prev.firstStudied || todayStr()
  };

  userState.lastStudyDate = todayStr();
  userState.streak = calculateStreak();
  saveState();

  currentWordIdx++;
  const tw = userState.todayWords || [];
  if (currentWordIdx >= tw.length) {
    document.getElementById('learn-empty').style.display = '';
    document.getElementById('learn-content').style.display = 'none';
    showToast('🎉 今日任务完成！获得 ' + sessionXP + ' XP');
    updateProgressUI();
    updateHomeScreen();
  } else {
    startWordLesson();
  }
}

// ═══════════════════ AUDIO ═══════════════════
let bestVoice = null;
function loadVoices() {
  const voices = speechSynthesis.getVoices();
  if (voices.length === 0) return;
  const preferred = ['Samantha', 'Karen', 'Alex', 'Moira', 'Fiona'];
  for (const name of preferred) {
    bestVoice = voices.find(v => v.name === name);
    if (bestVoice) break;
  }
  if (!bestVoice) bestVoice = voices.find(v => v.lang.startsWith('en')) || voices[0];
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speakText(text, btnEl) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US'; utter.rate = 0.85; utter.pitch = 1;
  if (bestVoice) utter.voice = bestVoice;
  if (btnEl) btnEl.classList.add('playing');
  utter.onend = () => { if (btnEl) btnEl.classList.remove('playing'); };
  utter.onerror = () => { if (btnEl) btnEl.classList.remove('playing'); };
  window.speechSynthesis.speak(utter);
}

function playWordAudio(word) {
  speakText(word, document.getElementById('ex-audio-btn'));
}

function speakPhrase(phrase) {
  speakText(phrase, null);
}

// ═══════════════════ DICTIONARY LOOKUP ═══════════════════
let dictCache = {};
try {
  const raw = JSON.parse(localStorage.getItem('vocab-dict-cache') || '{}');
  // Migrate old format (raw API response) to new format ({data, zhTranslation})
  for (const [key, val] of Object.entries(raw)) {
    if (val.data) { dictCache[key] = val; }
    else if (Array.isArray(val)) { dictCache[key] = { data: val, zhTranslation: '' }; }
  }
} catch(e) {}

async function lookupDictionary() {
  const query = document.getElementById('dict-search').value.trim();
  const resultEl = document.getElementById('dict-result');
  const localHitsEl = document.getElementById('dict-local-hits');

  if (!query) { resultEl.innerHTML = '📖 输入任意英文单词，查看释义、发音和例句<br><small style="color:var(--text-secondary)">也支持输入中文查找英文单词</small>'; localHitsEl.innerHTML = ''; return; }

  // Detect Chinese input (contains CJK characters)
  const isChinese = /[\u4e00-\u9fff]/.test(query);

  if (isChinese) {
    lookupChineseToEnglish(query);
    return;
  }

  // English lookup (existing flow)
  const queryLower = query.toLowerCase();

  // 1. Check cache
  if (dictCache[queryLower]) {
    renderDictResult(queryLower, dictCache[queryLower]);
    checkLocalHits(queryLower);
    return;
  }

  // 2. Show loading
  resultEl.innerHTML = '<div style="padding:40px"><span style="font-size:32px">⏳</span><br>查询中...</div>';
  localHitsEl.innerHTML = '';

  // 3. Fetch dictionary + Chinese translation in parallel
  try {
    const [dictResp, zhResp] = await Promise.all([
      fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(queryLower)),
      fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(queryLower) + '&langpair=en|zh')
    ]);

    if (!dictResp.ok) throw new Error('not found');
    const data = await dictResp.json();
    let zhTranslation = '';

    try {
      const zhData = await zhResp.json();
      zhTranslation = zhData.responseData?.translatedText || '';
    } catch(e) { /* translation optional */ }

    const cached = { data, zhTranslation };
    dictCache[queryLower] = cached;
    localStorage.setItem('vocab-dict-cache', JSON.stringify(dictCache));
    renderDictResult(queryLower, cached);
  } catch(e) {
    resultEl.innerHTML = '<div style="padding:40px;color:var(--error)"><span style="font-size:32px">😕</span><br>未找到该单词<br><small>请检查拼写后重试</small></div>';
  }

  checkLocalHits(queryLower);
}

// ═══════════ CHINESE → ENGLISH LOOKUP ═══════════
async function lookupChineseToEnglish(zhQuery) {
  const resultEl = document.getElementById('dict-result');
  const localHitsEl = document.getElementById('dict-local-hits');

  resultEl.innerHTML = '<div style="padding:40px"><span style="font-size:32px">⏳</span><br>翻译中...</div>';
  localHitsEl.innerHTML = '';

  // 1. Check local word database for matching Chinese translations
  checkLocalHits(zhQuery);

  // 2. Query MyMemory for Chinese→English
  try {
    const resp = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(zhQuery) + '&langpair=zh|en');
    const data = await resp.json();
    const enTranslation = data.responseData?.translatedText || '';

    if (!enTranslation) {
      if (!document.getElementById('dict-local-hits').innerHTML) {
        resultEl.innerHTML = '<div style="padding:40px;color:var(--error)"><span style="font-size:32px">😕</span><br>未找到翻译<br><small>请尝试其他中文词语</small></div>';
      }
      return;
    }

    // 3. Split multiple possible translations, query dictionary for each
    const enWords = enTranslation.split(/[,，;；、]/).map(s => s.trim().toLowerCase()).filter(Boolean).slice(0, 5);

    // Query dictionary for first English word (for detailed definition)
    let dictData = null;
    try {
      const dictResp = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(enWords[0]));
      if (dictResp.ok) dictData = await dictResp.json();
    } catch(e) {}

    // Render results
    let html = '<div style="background:var(--card-bg);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)">';

    // Chinese header
    html += '<div style="font-size:28px;font-weight:700;color:var(--text);margin-bottom:4px">' + zhQuery + '</div>';
    html += '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:14px">中文 → 英文</div>';

    // English translations
    html += '<div style="font-size:16px;font-weight:600;color:var(--secondary);margin-bottom:4px">英文翻译：</div>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">';
    for (const w of enWords) {
      html += '<span style="background:#EFF6FF;color:#1E40AF;padding:6px 14px;border-radius:16px;font-weight:600;cursor:pointer;font-size:15px" onclick="document.getElementById(\'dict-search\').value=\'' + w + '\';lookupDictionary()">' + w + '</span>';
    }
    html += '</div>';

    // Dictionary definition for first word
    if (dictData && dictData[0]) {
      const entry = dictData[0];
      html += '<div style="border-top:1px solid #E5E7EB;padding-top:12px;margin-top:8px">';
      html += '<div style="font-size:20px;font-weight:700;color:var(--text)">' + entry.word + '</div>';
      if (entry.phonetic) {
        html += '<div style="font-size:15px;color:var(--text-secondary);margin-bottom:4px">' + entry.phonetic + ' ';
        const audioUrl = entry.phonetics?.find(p => p.audio)?.audio || '';
        if (audioUrl) {
          html += '<button class="audio-btn" style="font-size:18px" onclick="playDictAudio(\'' + audioUrl + '\', this)">🔊</button>';
        }
        html += '</div>';
      }
      entry.meanings.slice(0, 2).forEach(m => {
        html += '<span style="display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;background:#DBEAFE;color:#1E40AF;margin-right:6px;margin-bottom:6px">' + m.partOfSpeech + '</span>';
        m.definitions.slice(0, 2).forEach(d => {
          html += '<div style="font-size:14px;margin-bottom:2px;padding-left:8px;border-left:2px solid #E5E7EB">' + d.definition + '</div>';
        });
      });
      html += '</div>';
    }

    html += '</div>';
    resultEl.innerHTML = html;

  } catch(e) {
    if (!document.getElementById('dict-local-hits').innerHTML) {
      resultEl.innerHTML = '<div style="padding:40px;color:var(--error)"><span style="font-size:32px">😕</span><br>翻译失败<br><small>请稍后重试</small></div>';
    }
  }
}

function checkLocalHits(query) {
  const localHitsEl = document.getElementById('dict-local-hits');
  // Match against both English word and Chinese translation
  const isChinese = /[\u4e00-\u9fff]/.test(query);
  let matches;
  if (isChinese) {
    matches = words.filter(w => w.translation.includes(query));
  } else {
    matches = words.filter(w => w.word.toLowerCase() === query.toLowerCase());
  }
  if (matches.length > 0) {
    localHitsEl.innerHTML = '<div style="font-weight:600;color:var(--success);margin-bottom:8px">📚 该单词已在你的词库中！</div>' +
      matches.map(w => '<div class="wb-word-item" onclick="showWordDetail(\'' + w.id + '\')" style="border-left:3px solid var(--success)">' +
        '<div><div class="wb-word-main">' + w.word + ' <span style="font-size:13px;color:var(--text-secondary)">' + w.phonetic + '</span></div>' +
        '<div class="wb-word-sub">' + w.translation + '</div></div>' +
        '<span class="wb-word-grade g' + w.grade + '">' + (w.grade === 7 ? '初一' : w.grade === 8 ? '初二' : '初三') + '</span></div>').join('');
  } else {
    localHitsEl.innerHTML = '';
  }
}

function renderDictResult(query, cached) {
  const data = cached.data;
  const zhTranslation = cached.zhTranslation || '';
  const entry = data[0];
  const word = entry.word;
  const phonetic = entry.phonetic || (entry.phonetics && entry.phonetics[0] && entry.phonetics[0].text) || '';
  const audioUrl = entry.phonetics && entry.phonetics.find(p => p.audio)?.audio || '';

  let html = '<div style="background:var(--card-bg);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)">';

  // Word header
  html += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">';
  html += '<div style="font-size:32px;font-weight:700;color:var(--text)">' + word + '</div>';
  if (phonetic) html += '<div style="font-size:17px;color:var(--text-secondary)">' + phonetic + '</div>';
  if (audioUrl) {
    html += '<button class="audio-btn" style="font-size:22px" onclick="playDictAudio(\'' + audioUrl + '\', this)">🔊</button>';
  } else {
    html += '<button class="audio-btn" style="font-size:22px" onclick="speakText(\'' + word.replace(/'/g, "\\\\'") + '\', this)">🔊</button>';
  }
  html += '</div>';

  // Chinese translation
  if (zhTranslation) {
    html += '<div style="font-size:20px;font-weight:600;color:var(--secondary);margin-bottom:14px;padding:10px 14px;background:#EFF6FF;border-radius:8px;border-left:4px solid var(--secondary)">' + zhTranslation + '</div>';
  }

  // Meanings
  entry.meanings.forEach(m => {
    html += '<div style="margin-bottom:14px">';
    html += '<span style="display:inline-block;padding:2px 10px;border-radius:8px;font-size:12px;font-weight:600;background:#DBEAFE;color:#1E40AF;margin-bottom:6px">' + m.partOfSpeech + '</span>';
    m.definitions.slice(0, 3).forEach((def, i) => {
      html += '<div style="margin-bottom:4px;padding-left:12px;border-left:2px solid #E5E7EB">';
      html += '<div style="font-size:14px;color:var(--text)">' + def.definition + '</div>';
      if (def.example) {
        html += '<div style="font-size:13px;color:var(--text-secondary);margin-top:2px">💬 ' + def.example + '</div>';
      }
      html += '</div>';
    });
    // Synonyms
    if (m.synonyms && m.synonyms.length > 0) {
      html += '<div style="font-size:12px;color:var(--text-secondary);margin-top:4px">近义词: ' + m.synonyms.slice(0, 5).join(', ') + '</div>';
    }
    html += '</div>';
  });

  // Source
  if (entry.sourceUrls && entry.sourceUrls[0]) {
    html += '<div style="font-size:11px;color:var(--text-secondary);margin-top:8px;text-align:right">来源: ' + entry.sourceUrls[0] + '</div>';
  }

  html += '</div>';
  document.getElementById('dict-result').innerHTML = html;
}

function playDictAudio(url, btn) {
  if (btn) btn.classList.add('playing');
  const audio = new Audio(url);
  audio.onended = () => { if (btn) btn.classList.remove('playing'); };
  audio.onerror = () => { if (btn) btn.classList.remove('playing'); speakText(document.getElementById('dict-search').value.trim(), btn); };
  audio.play();
}

// ═══════════════════ WORD BANK ═══════════════════
let wbFilter = 'all';
let wbUnitFilter = 'all';
function setFilter(grade, el) {
  wbFilter = grade;
  document.querySelectorAll('#wordbank-screen .wb-filters:first-child .wb-filter').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  updateUnitFilters();
  filterWords();
}
function setUnitFilter(unit, el) {
  wbUnitFilter = unit;
  document.querySelectorAll('#wb-unit-filters .wb-filter').forEach(b => b.classList.remove('active'));
  if (el) el.classList.add('active');
  filterWords();
}
function updateUnitFilters() {
  const unitEl = document.getElementById('wb-unit-filters');
  if (wbFilter === 'all') {
    unitEl.style.display = 'none';
    wbUnitFilter = 'all';
    return;
  }
  // Get unique units for this grade
  const grade = parseInt(wbFilter);
  const units = [...new Set(words.filter(w => w.grade === grade).map(w => w.semester + w.unit))].sort();
  unitEl.style.display = 'flex';
  unitEl.innerHTML = '<button class="wb-filter active" onclick="setUnitFilter(\'all\', this)">全部单元</button>' +
    units.map(u => '<button class="wb-filter" onclick="setUnitFilter(\'' + u + '\', this)">' + u + '</button>').join('');
}
function filterWords() {
  const query = document.getElementById('wb-search').value.toLowerCase();
  let filtered = words;
  if (wbFilter !== 'all') filtered = filtered.filter(w => w.grade === parseInt(wbFilter));
  if (wbUnitFilter !== 'all') filtered = filtered.filter(w => (w.semester + w.unit) === wbUnitFilter);
  if (query) filtered = filtered.filter(w => w.word.toLowerCase().includes(query) || w.translation.includes(query));
  document.getElementById('wb-word-list').innerHTML = filtered.slice(0, 50).map(w => {
    const gradeClass = 'g' + w.grade;
    return '<div class="wb-word-item" onclick="showWordDetail(\'' + w.id + '\')">' +
      '<div><div class="wb-word-main">' + w.word + ' <span style="font-size:13px;color:var(--text-secondary)">' + w.phonetic + '</span></div>' +
      '<div class="wb-word-sub">' + w.translation + ' <span style="font-size:11px;color:var(--text-secondary)">' + (w.semester||'') + (w.unit||'') + '</span></div></div>' +
      '<span class="wb-word-grade ' + gradeClass + '">' + (w.grade === 7 ? '初一' : w.grade === 8 ? '初二' : '初三') + '</span></div>';
  }).join('');
}

function filterPhrases() {
  const query = document.getElementById('phrase-search').value.toLowerCase();
  let filtered = corePhrases;
  if (query) filtered = filtered.filter(p => p.phrase.toLowerCase().includes(query) || p.translation.includes(query));
  document.getElementById('phrase-list').innerHTML = filtered.slice(0, 30).map(p =>
    '<div class="wb-word-item" style="cursor:default">' +
      '<div><div class="wb-word-main">' + p.phrase + '</div>' +
      '<div class="wb-word-sub">' + p.translation + '</div></div>' +
      '<span style="font-size:11px;color:var(--text-secondary)">核心</span></div>'
  ).join('');
}

// ═══════════════════ MODAL ═══════════════════
function showWordDetail(id) {
  const w = getWordById(id);
  if (!w) return;
  const p = userState.wordProgress[id];
  const status = !p || !p.reps ? '未学习' : p.reps > 3 ? '✅ 已掌握' : '📖 学习中';
  const correctPct = p && (p.correct + p.incorrect) > 0 ? Math.round(p.correct / (p.correct + p.incorrect) * 100) + '%' : '--';
  let html = '<button class="modal-close" onclick="document.getElementById(\'word-modal\').classList.remove(\'show\')">✕</button>';
  html += '<h3>' + w.word + '</h3>';
  html += '<div style="font-size:15px;color:var(--text-secondary);margin-bottom:8px">' + w.phonetic + '</div>';
  html += '<div style="font-size:18px;color:var(--secondary);font-weight:600;margin-bottom:16px">' + w.translation + '</div>';
  html += '<div style="display:flex;gap:12px;margin-bottom:16px;font-size:13px;color:var(--text-secondary)">' +
    '<span>' + (w.grade === 7 ? '初一' : w.grade === 8 ? '初二' : '初三') + (w.semester||'') + (w.unit||'') + '</span><span>' + status + '</span><span>正确率: ' + correctPct + '</span></div>';
  html += '<div style="font-weight:600;margin-bottom:8px">📝 常用短语</div>';
  w.phrases.forEach(p => {
    html += '<div style="background:#F3F4F6;padding:8px 12px;border-radius:8px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center">' +
      '<span><strong>' + p.phrase + '</strong><br><span style="color:var(--text-secondary);font-size:12px">' + p.translation + '</span></span>' +
      '<button class="audio-btn" onclick="speakPhrase(\'' + p.phrase.replace(/'/g, "\\'") + '\')">🔊</button></div>';
  });
  if (w.examples && w.examples.length > 0) {
    html += '<div style="font-weight:600;margin:12px 0 8px">💬 例句</div>';
    w.examples.forEach(e => {
      html += '<div style="margin-bottom:6px;font-size:14px">' + e.sentence + '</div>';
      html += '<div style="margin-bottom:10px;font-size:13px;color:var(--text-secondary)">' + e.translation + '</div>';
    });
  }
  document.getElementById('modal-card').innerHTML = html;
  document.getElementById('word-modal').classList.add('show');
}
function closeModal(e) {
  if (e.target === e.currentTarget) document.getElementById('word-modal').classList.remove('show');
}

// ═══════════════════ PROGRESS ═══════════════════
function updateProgressUI() {
  const total = Object.keys(userState.wordProgress).length;
  const goal = userState.dailyGoal || 20;
  const today = userState.todayReviewed || 0;
  document.getElementById('progress-count').textContent = today + '/' + goal;
  const circumference = 452;
  document.getElementById('progress-circle').style.strokeDashoffset = circumference - (Math.min(today, goal) / goal) * circumference;
  document.getElementById('stat-learned').textContent = total;
  document.getElementById('stat-today').textContent = today;
  document.getElementById('stat-xp').textContent = userState.totalXP || 0;
  const totalCorrect = Object.values(userState.wordProgress).reduce((s, p) => s + (p.correct || 0), 0);
  const totalAttempts = Object.values(userState.wordProgress).reduce((s, p) => s + (p.correct || 0) + (p.incorrect || 0), 0);
  document.getElementById('stat-accuracy').textContent = totalAttempts > 0 ? Math.round(totalCorrect / totalAttempts * 100) + '%' : '--%';

  // Ebbinghaus curve
  renderEbbinghausCurve();

  // Error book
  renderErrorBook();

  // Weak words
  const weak = Object.entries(userState.wordProgress)
    .filter(([_, p]) => (p.incorrect || 0) >= 3 && (p.correct || 0) < (p.incorrect || 0))
    .slice(0, 10);
  document.getElementById('weak-words-list').innerHTML = weak.map(([id]) => {
    const w = getWordById(id);
    return w ? '<div class="weak-word">' + w.word + ' — ' + w.translation + '</div>' : '';
  }).join('');
}

function renderEbbinghausCurve() {
  // Count words at each Ebbinghaus stage
  const stageCount = new Array(EBBINGHAUS_INTERVALS.length + 1).fill(0);
  const today = todayStr();

  Object.values(userState.wordProgress).forEach(p => {
    const stage = p.stage || 0;
    if (stage >= 0 && stage <= EBBINGHAUS_INTERVALS.length) {
      stageCount[stage]++;
    }
  });

  // Determine which stage is "current" (where most review is needed today)
  let currentStage = 0;
  for (let i = 0; i < stageCount.length; i++) {
    if (stageCount[i] > 0) currentStage = Math.max(currentStage, i);
  }

  // Draw the curve
  // Memory retention formula: R = e^(-t/S) where S is relative strength
  // Simplified visual: 100% at stage 0, drops, recovers at each review
  const retentionPoints = [
    { x: 0, y: 100 },  // just learned
    { x: 1, y: 58 },   // 1 day
    { x: 2, y: 44 },   // 2 days
    { x: 3, y: 80 },   // reviewed at 2 days (recovery)
    { x: 4, y: 52 },   // 4 days from last review
    { x: 5, y: 85 },   // reviewed again
    { x: 6, y: 55 },   // 7 days
    { x: 7, y: 90 },   // reviewed
    { x: 8, y: 60 },   // before review
    { x: 9, y: 95 },   // mastered
  ];

  // Scale to SVG coordinates (300x100)
  const points = retentionPoints.map((p, i) => {
    const x = (i / (retentionPoints.length - 1)) * 300;
    const y = 100 - (p.y / 100) * 80; // 80% of height for padding
    return x + ',' + y;
  }).join(' ');

  document.getElementById('eb-curve').setAttribute('points', points);

  // Render stage labels
  const stagesEl = document.getElementById('ebbinghaus-stages');
  const stageLabels = ['初学', '1天', '2天', '4天', '7天', '15天', '30天', '掌握'];
  stagesEl.innerHTML = stageLabels.map((label, i) => {
    let cls = 'eb-stage';
    if (stageCount[i] > 0) cls += ' has-words';
    if (i === currentStage && stageCount[i] > 0) cls += ' current';
    if (i < currentStage && stageCount[i] > 0) cls += ' done';
    return '<span class="' + cls + '">' + label + '<br><small>' + stageCount[i] + '词</small></span>';
  }).join('');
}

function renderErrorBook() {
  // Get all words with any incorrect answers
  const errors = Object.entries(userState.wordProgress)
    .filter(([_, p]) => (p.incorrect || 0) > 0)
    .sort((a, b) => (b[1].incorrect || 0) - (a[1].incorrect || 0))
    .slice(0, 15);

  const countEl = document.getElementById('error-count');
  const listEl = document.getElementById('error-word-list');
  const btnEl = document.getElementById('review-errors-btn');

  if (errors.length === 0) {
    countEl.textContent = '— 还没有错题，继续保持！🎉';
    listEl.innerHTML = '';
    btnEl.style.display = 'none';
    return;
  }

  countEl.textContent = '— ' + errors.length + ' 个单词需要复习';
  btnEl.style.display = 'block';

  listEl.innerHTML = errors.map(([id, p]) => {
    const w = getWordById(id);
    if (!w) return '';
    const total = (p.correct || 0) + (p.incorrect || 0);
    const pct = total > 0 ? Math.round((p.correct || 0) / total * 100) : 0;
    return '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F3F4F6;cursor:pointer" onclick="practiceSingleWord(\'' + id + '\')">' +
      '<div><strong>' + w.word + '</strong> <span style="font-size:13px;color:var(--text-secondary)">' + w.translation + '</span></div>' +
      '<div style="display:flex;align-items:center;gap:8px">' +
        '<span style="font-size:12px;color:var(--error)">✕' + (p.incorrect || 0) + '</span>' +
        '<span style="font-size:12px;color:var(--success)">✓' + (p.correct || 0) + '</span>' +
        '<span style="font-size:12px;background:#FEE2E2;color:#991B1B;padding:2px 8px;border-radius:8px">' + pct + '%</span>' +
        '<span style="font-size:18px;color:var(--primary)">▶</span>' +
      '</div></div>';
  }).join('');
}

function reviewErrors() {
  const errorIds = Object.entries(userState.wordProgress)
    .filter(([_, p]) => (p.incorrect || 0) > 0)
    .map(([id]) => id);
  if (errorIds.length === 0) return;
  userState.todayWords = errorIds.sort(() => Math.random() - 0.5);
  userState.lastStudyDate = todayStr();
  saveState();
  showScreen('learn');
  currentWordIdx = 0;
  startWordLesson();
  showToast('📕 开始复习 ' + errorIds.length + ' 个错题');
}

function practiceSingleWord(id) {
  userState.todayWords = [id];
  userState.lastStudyDate = todayStr();
  saveState();
  showScreen('learn');
  currentWordIdx = 0;
  startWordLesson();
  showToast('📕 练习: ' + (getWordById(id)?.word || ''));
}

function updateHomeScreen() {
  const hour = new Date().getHours();
  let greet = '早上好';
  if (hour >= 12 && hour < 18) greet = '下午好';
  if (hour >= 18) greet = '晚上好';
  document.getElementById('greeting').innerHTML = greet + ' 👋<strong>开始学习吧</strong>';
  document.getElementById('xp-badge-home').textContent = '⭐ ' + (userState.totalXP || 0) + ' XP';
  const tw = userState.todayWords || [];
  const chips = document.getElementById('word-chips');
  if (tw.length === 0) {
    chips.innerHTML = '<span style="color:var(--text-secondary)">点击「开始学习」获取今日任务</span>';
  } else {
    chips.innerHTML = tw.slice(0, 10).map(id => {
      const w = getWordById(id);
      const p = userState.wordProgress[id];
      let cls = '';
      let badge = '';
      if (p && p.stage >= EBBINGHAUS_INTERVALS.length) {
        cls = 'mastered';
        badge = ' ✓';
      } else if (p && p.stage > 0) {
        cls = 'learning';
        badge = ' 第' + p.stage + '次';
      }
      return w ? '<span class="word-chip ' + cls + '">' + w.word + badge + '</span>' : '';
    }).join('');
    if (tw.length > 10) chips.innerHTML += '<span class="word-chip">+' + (tw.length - 10) + ' 个</span>';
  }

  // Show Ebbinghaus summary
  const progress = userState.wordProgress;
  const stageDist = new Array(EBBINGHAUS_INTERVALS.length + 1).fill(0);
  Object.values(progress).forEach(p => { stageDist[Math.min(p.stage || 0, EBBINGHAUS_INTERVALS.length)]++; });
  const todayReview = Object.values(progress).filter(p => {
    return p.nextReview && p.nextReview <= todayStr() && (p.stage || 0) < EBBINGHAUS_INTERVALS.length;
  }).length;
  if (todayReview > 0) {
    document.getElementById('today-review-hint').textContent = '今日艾宾浩斯复习：' + todayReview + ' 个单词到期';
  } else {
    document.getElementById('today-review-hint').textContent = '暂无到期复习';
  }
}

// ═══════════════════ NAV ═══════════════════
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const screenMap = { 'home': 'home-screen', 'learn': 'learn-screen', 'wordbank': 'wordbank-screen', 'dictionary': 'dictionary-screen', 'stats': 'stats-screen' };
  const screenId = screenMap[name];
  if (screenId) document.getElementById(screenId).classList.add('active');
  const tabMap = { 'home': 0, 'learn': 1, 'dictionary': 2, 'wordbank': 3, 'stats': 4 };
  const idx = tabMap[name];
  if (idx !== undefined) document.querySelectorAll('.tab-btn')[idx].classList.add('active');
  if (name === 'stats') updateProgressUI();
  if (name === 'wordbank') { filterWords(); filterPhrases(); }
  if (name === 'home') updateHomeScreen();
  updateStreakUI();
}

// ═══════════════════ TOAST ═══════════════════
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ═══════════════════ RESET ═══════════════════
function resetAllProgress() {
  if (confirm('确定要重置所有学习数据吗？此操作不可撤销！')) {
    userState = { wordProgress: {}, streak: 0, lastStudyDate: '', dailyGoal: 20, todayReviewed: 0, todayCorrect: 0, todayWords: [], totalXP: 0, todayXP: 0 };
    saveState();
    updateProgressUI(); updateHomeScreen(); updateStreakUI();
    showToast('已重置');
  }
}

// ═══════════════════ INIT ═══════════════════
async function init() {
  try {
    const resp = await fetch('words.json');
    words = await resp.json();
  } catch(e) {
    showToast('⚠️ 无法加载词库数据');
    return;
  }

  // Load core phrases
  try {
    const pResp = await fetch('phrases.json');
    corePhrases = await pResp.json();
    document.getElementById('phrase-count').textContent = '— ' + corePhrases.length + ' 条';
  } catch(e) { /* phrases optional */ }
  loadState();
  if (userState.lastStudyDate !== todayStr()) {
    userState.todayReviewed = 0; userState.todayCorrect = 0; userState.todayXP = 0;
  }
  userState.streak = calculateStreak();
  saveState();
  updateHomeScreen(); updateStreakUI(); updateProgressUI();
  document.addEventListener('click', () => { try { getAudioCtx().resume(); } catch(e) {} }, { once: true });
}
init();
</script>
