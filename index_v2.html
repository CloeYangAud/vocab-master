<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>词博士 — 中考英语词汇大师</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #FF6B35; --primary-light: #FF8C5A; --secondary: #004E89;
  --accent: #F7C948; --bg: #FAFAFA; --card: #FFFFFF; --text: #1A1A2E;
  --text2: #6B7280; --success: #10B981; --error: #EF4444;
  --radius: 14px; --safe: env(safe-area-inset-bottom, 16px);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* ─── SCREENS ─── */
.screen{display:none;padding:16px 16px 100px;max-width:500px;margin:0 auto}
.screen.active{display:block}

/* ─── TOP BAR ─── */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0;max-width:500px;margin:0 auto}
.topbar .title{font-size:20px;font-weight:700;display:flex;align-items:center;gap:6px}
.topbar .streak{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;padding:6px 14px;border-radius:20px;font-weight:700;font-size:14px;animation:pulse-glow 2s ease-in-out infinite}
@keyframes pulse-glow{0%,100%{box-shadow:0 2px 8px rgba(255,107,53,0.3)}50%{box-shadow:0 4px 20px rgba(255,107,53,0.5)}}

/* ─── HOME ─── */
.hero{text-align:center;padding:20px 0}
.hero .owl{font-size:56px;animation:mascot-bounce 2s ease-in-out infinite;display:inline-block}
.hero .greeting{font-size:15px;color:var(--text2);margin-top:4px}
.hero .greeting strong{font-size:22px;color:var(--text);display:block;margin-top:2px}
@keyframes mascot-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hero .xp{display:inline-block;background:var(--accent);color:#92400E;padding:4px 14px;border-radius:16px;font-weight:700;font-size:14px;margin-top:8px}
.progress-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:0 2px 12px rgba(0,0,0,0.06);text-align:center;margin:12px 0}
.progress-ring{position:relative;width:130px;height:130px;margin:0 auto 12px}
.progress-ring svg{transform:rotate(-90deg)}
.progress-ring .bg{fill:none;stroke:#E5E7EB;stroke-width:8}
.progress-ring .fill{fill:none;stroke:var(--primary);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 0.6s}
.progress-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.progress-center .num{font-size:28px;font-weight:700;color:var(--primary)}
.progress-center .lbl{font-size:11px;color:var(--text2)}
.cta-btn{display:block;width:100%;padding:14px;border:none;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;font-size:17px;font-weight:700;border-radius:var(--radius);cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(255,107,53,0.3);-webkit-tap-highlight-color:transparent}
.cta-btn:active{transform:scale(0.97)}

/* ─── LEARN ─── */
.learn-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.learn-top .back{background:var(--card);border:1px solid #E5E7EB;padding:6px 14px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--text2);-webkit-tap-highlight-color:transparent}
.mascot-bar{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--radius);padding:10px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.mascot-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;transition:all 0.3s}
.mascot-icon.happy{background:#FEF3C7;animation:mascot-bounce 0.6s}
.mascot-icon.think{background:#DBEAFE}
.mascot-icon.celebrate{background:#D1FAE5;animation:mascot-spin 0.5s}
.mascot-icon.encourage{background:#FEE2E2;animation:mascot-nod 0.4s}
@keyframes mascot-spin{0%{transform:rotate(0)scale(1)}50%{transform:rotate(15deg)scale(1.15)}100%{transform:rotate(0)scale(1)}}
@keyframes mascot-nod{0%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}100%{transform:rotate(0)}}
.mascot-msg{font-size:13px;font-weight:500;line-height:1.4}
.stats-row{display:flex;gap:8px;margin-bottom:10px;font-size:13px;font-weight:600}
.stats-row span{background:var(--card);padding:4px 10px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
.xp-stat{color:#92400E}.combo-stat{color:var(--primary);display:none}.combo-stat.show{display:inline}.combo-stat.fire{animation:combo-pop 0.3s}
@keyframes combo-pop{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}
.dots-row{display:flex;gap:6px;margin-bottom:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#E5E7EB;transition:all 0.2s}
.dot.done{background:var(--success)}.dot.current{background:var(--primary);transform:scale(1.4)}.dot.wrong{background:var(--error)}

/* Exercise card */
.ex-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:0 2px 12px rgba(0,0,0,0.06);min-height:240px;display:flex;flex-direction:column;transition:all 0.2s}
.ex-card.shake{animation:shake 0.4s}.ex-card.pop{animation:pop 0.3s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
.ex-badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600;margin-bottom:10px}
.ex-badge.translate{background:#DBEAFE;color:#1E40AF}
.ex-badge.listening{background:#FEF3C7;color:#92400E}
.ex-badge.fill{background:#D1FAE5;color:#065F46}
.ex-badge.match{background:#F3E8FF;color:#6B21A8}
.ex-prompt{font-size:26px;font-weight:700;text-align:center;margin-bottom:4px;word-break:break-word}
.ex-prompt.sm{font-size:20px}.ex-prompt.lg{font-size:32px}
.ex-sub{font-size:14px;color:var(--text2);text-align:center;margin-bottom:14px}
.ex-audio{display:block;margin:0 auto 10px;width:48px;height:48px;border-radius:50%;border:3px solid var(--primary);background:var(--card);cursor:pointer;font-size:24px;-webkit-tap-highlight-color:transparent}
.ex-audio:active{transform:scale(1.1);background:#FFF7F0}
.ex-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.ex-opts.col1{grid-template-columns:1fr}
.ex-opt{padding:14px 10px;border:2px solid #E5E7EB;border-radius:10px;background:var(--card);cursor:pointer;font-family:inherit;font-size:15px;font-weight:600;text-align:center;transition:all 0.15s;-webkit-tap-highlight-color:transparent;min-height:48px;display:flex;align-items:center;justify-content:center}
.ex-opt:active{transform:scale(0.96)}
.ex-opt.correct{background:#D1FAE5;border-color:var(--success);color:#065F46;animation:opt-correct 0.4s}
.ex-opt.incorrect{background:#FEE2E2;border-color:var(--error);color:#991B1B;animation:opt-incorrect 0.4s}
.ex-opt:disabled{pointer-events:none;opacity:0.7}
@keyframes opt-correct{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes opt-incorrect{0%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}100%{transform:translateX(0)}}
.ex-fb{text-align:center;margin-top:10px;font-weight:700;font-size:16px;min-height:22px}
.ex-fb.good{color:var(--success)}.ex-fb.bad{color:var(--error)}

/* Intro */
.intro-word{font-size:38px;font-weight:700;text-align:center;margin-bottom:2px}
.intro-phonetic{font-size:16px;color:var(--text2);text-align:center;margin-bottom:8px}
.intro-trans{font-size:20px;font-weight:600;color:var(--secondary);text-align:center;margin-bottom:12px}
.intro-phrase{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0;font-size:14px;background:#F3F4F6;padding:8px 14px;border-radius:8px}
.intro-phrase .en{font-weight:500}.intro-phrase .zh{color:var(--text2);font-size:12px}
.intro-start{width:100%;padding:12px;border:none;margin-top:14px;background:linear-gradient(135deg,#10B981,#059669);color:#fff;font-size:16px;font-weight:700;border-radius:10px;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}

/* Rate */
.rate-section{display:none;margin-top:10px}
.rate-section.show{display:block}
.rate-section h4{text-align:center;font-size:13px;color:var(--text2);margin-bottom:8px}
.rate-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate-btn{padding:10px 6px;border:2px solid #E5E7EB;border-radius:10px;background:var(--card);cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;transition:all 0.15s;-webkit-tap-highlight-color:transparent}
.rate-btn:active{transform:scale(0.95)}
.rate-btn.again{color:var(--error)}.rate-btn.hard{color:var(--accent)}.rate-btn.good{color:var(--secondary)}.rate-btn.easy{color:var(--success)}

/* Summary */
.summary{text-align:center;padding:10px 0}
.summary .big-word{font-size:30px;font-weight:700}
.summary .big-trans{font-size:17px;color:var(--secondary);font-weight:600}
.summary .stats{font-size:13px;color:var(--text2);margin:6px 0}
.perfect-badge{display:inline-block;padding:5px 14px;background:linear-gradient(135deg,#10B981,#34D399);color:#fff;border-radius:16px;font-weight:700;font-size:14px;animation:bounce-in 0.5s}
@keyframes bounce-in{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}

/* Complete */
.learn-done{text-align:center;padding:40px 20px}
.learn-done .emoji{font-size:64px;margin-bottom:12px;animation:bounce-in 0.5s}
.learn-done h2{font-size:20px;margin-bottom:6px}
.learn-done p{color:var(--text2)}

/* ─── STATS ─── */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.stat-item{background:var(--card);padding:14px;border-radius:var(--radius);box-shadow:0 2px 8px rgba(0,0,0,0.04);text-align:center}
.stat-val{font-size:26px;font-weight:700;color:var(--primary)}
.stat-lbl{font-size:11px;color:var(--text2)}
.eb-card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.eb-card h3{font-size:14px;margin-bottom:10px}
.eb-curve{width:100%;height:100px}
.eb-stages{display:flex;gap:3px;margin-top:8px;font-size:10px}
.eb-s{flex:1;text-align:center;padding:3px 0;border-radius:5px;font-weight:600;color:var(--text2);background:#F3F4F6}
.eb-s.has{background:#DBEAFE;color:#1E40AF}
.eb-s.cur{background:var(--primary);color:#fff}
.eb-s.done{background:#D1FAE5;color:#065F46}
.err-book{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;border-left:4px solid var(--error);box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.err-book h3{font-size:14px;margin-bottom:8px}
.err-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F3F4F6;cursor:pointer}
.err-item .word{font-weight:600}.err-item .trans{font-size:13px;color:var(--text2)}
.err-item .badge{font-size:11px;padding:2px 8px;border-radius:8px;background:#FEE2E2;color:#991B1B}

/* ─── TOAST ─── */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 20px;border-radius:20px;font-weight:600;font-size:14px;z-index:300;opacity:0;transition:opacity 0.2s;pointer-events:none}
.toast.show{opacity:1}

/* ─── TAB BAR ─── */
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid #E5E7EB;display:flex;justify-content:space-around;padding:8px 0 calc(8px + var(--safe));z-index:100;box-shadow:0 -2px 8px rgba(0,0,0,0.03)}
.tab-btn{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;cursor:pointer;padding:4px 16px;border-radius:8px;font-family:inherit;font-size:11px;color:var(--text2);transition:all 0.15s;-webkit-tap-highlight-color:transparent}
.tab-btn.active{color:var(--primary);font-weight:600}.tab-btn .icon{font-size:20px}

/* Floating FX */
.xp-float{position:fixed;font-weight:700;font-size:18px;pointer-events:none;z-index:250;animation:xp-rise 1s ease-out forwards}
@keyframes xp-rise{0%{opacity:1;transform:translateY(0)scale(1)}100%{opacity:0;transform:translateY(-60px)scale(1.3)}}
.confetti{position:fixed;pointer-events:none;z-index:250;font-size:18px;animation:confetti-fall 1.5s ease-out forwards}
@keyframes confetti-fall{0%{opacity:1;transform:translateY(0)rotate(0)}100%{opacity:0;transform:translateY(300px)rotate(720deg)}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- ═══ TOP BAR ═══ -->
<div class="topbar">
  <div class="title">🦉 词博士</div>
  <div class="streak" id="streak-badge">🔥 0 天</div>
</div>

<!-- ═══ HOME ═══ -->
<div class="screen active" id="home">
  <div class="hero">
    <div class="owl">🦉</div>
    <div class="greeting" id="hero-greeting">加载中...</div>
    <div class="xp" id="hero-xp">⭐ 0 XP</div>
  </div>
  <div class="progress-card">
    <div class="progress-ring">
      <svg width="130" height="130" viewBox="0 0 130 130">
        <circle class="bg" cx="65" cy="65" r="57"/>
        <circle class="fill" id="prog-fill" cx="65" cy="65" r="57" stroke-dasharray="358" stroke-dashoffset="358"/>
      </svg>
      <div class="progress-center">
        <div class="num" id="prog-num">0/20</div>
        <div class="lbl">今日目标</div>
      </div>
    </div>
    <button class="cta-btn" onclick="startLearning()">🎯 开始学习</button>
  </div>
</div>

<!-- ═══ LEARN ═══ -->
<div class="screen" id="learn">
  <div class="learn-top">
    <button class="back" onclick="showScreen('home')">← 返回</button>
    <span style="font-size:13px;color:var(--text2)" id="queue-info"></span>
    <div style="width:50px"></div>
  </div>
  <div class="learn-done" id="learn-done" style="display:none">
    <div class="emoji">🎉</div>
    <h2 id="done-title">今日任务已完成！</h2>
    <p id="done-msg">明天再来吧，坚持就是胜利 💪</p>
    <button class="cta-btn" style="margin-top:16px;width:200px" onclick="resetDailyQueue()">开始新一批</button>
  </div>
  <div id="learn-body">
    <div class="mascot-bar">
      <div class="mascot-icon happy" id="mascot-icon">🦉</div>
      <div class="mascot-msg" id="mascot-msg">准备好了吗？</div>
    </div>
    <div class="stats-row">
      <span class="xp-stat" id="ex-xp">⭐ 0</span>
      <div class="dots-row" id="ex-dots" style="display:inline-flex;margin:0"></div>
      <span class="combo-stat" id="ex-combo">🔥 x1</span>
    </div>
    <div class="ex-card" id="ex-card">
      <div id="ex-body"></div>
      <div class="ex-fb" id="ex-fb"></div>
    </div>
    <div class="rate-section" id="rate-section">
      <h4>这个单词掌握得怎么样？</h4>
      <div class="rate-btns">
        <button class="rate-btn again" onclick="rateWord(0)">😰 重来</button>
        <button class="rate-btn hard" onclick="rateWord(1)">🤔 困难</button>
        <button class="rate-btn good" onclick="rateWord(2)">😊 良好</button>
        <button class="rate-btn easy" onclick="rateWord(3)">😎 简单</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══ STATS ═══ -->
<div class="screen" id="stats">
  <div class="stat-grid">
    <div class="stat-item"><div class="stat-val" id="stat-learned">0</div><div class="stat-lbl">已学单词</div></div>
    <div class="stat-item"><div class="stat-val" id="stat-today">0</div><div class="stat-lbl">今日复习</div></div>
    <div class="stat-item"><div class="stat-val" id="stat-acc">--%</div><div class="stat-lbl">正确率</div></div>
    <div class="stat-item"><div class="stat-val" id="stat-xp">0</div><div class="stat-lbl">总经验值</div></div>
  </div>
  <div class="eb-card">
    <h3>🧠 艾宾浩斯记忆曲线</h3>
    <svg class="eb-curve" id="eb-curve" viewBox="0 0 300 90" preserveAspectRatio="none">
      <polyline id="eb-line" fill="none" stroke="#FF6B35" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <div class="eb-stages" id="eb-stages"></div>
  </div>
  <div class="err-book" id="err-book">
    <h3>📕 错题本 <span style="font-size:11px;font-weight:400;color:var(--text2)" id="err-count"></span></h3>
    <div id="err-list"></div>
    <button class="cta-btn" id="err-review" style="background:var(--error);font-size:14px;padding:10px;display:none" onclick="reviewErrors()">🔁 复习全部错题</button>
  </div>
</div>

<!-- ═══ TAB BAR ═══ -->
<div class="tab-bar">
  <button class="tab-btn active" onclick="showScreen('home')"><span class="icon">🏠</span>首页</button>
  <button class="tab-btn" onclick="startLearning()"><span class="icon">📖</span>学习</button>
  <button class="tab-btn" onclick="showScreen('stats')"><span class="icon">👤</span>我的</button>
</div>

<script>
// ═══════════ DATA ═══════════
let words = [];
let learnerName = '';
let userState = { wordProgress:{}, streak:0, lastStudyDate:'', todayReviewed:0, todayCorrect:0, todayWords:[], totalXP:0, todayXP:0 };
const DB = 'curated_words.json';
const EBBINGHAUS = [1,2,4,7,15,30,60];
const STAGE_NAMES = ['初学','1天','2天','4天','7天','15天','30天','掌握'];

function todayStr(){return new Date().toISOString().slice(0,10)}
function getWordById(id){return words.find(w=>w.id===id)}

function loadState(){
  try{const r=localStorage.getItem('vocab-master-v2');if(r)userState=JSON.parse(r)}catch(e){}
}
function saveState(){localStorage.setItem('vocab-master-v2',JSON.stringify(userState))}

// ═══════════ SOUNDS ═══════════
let ctx=null;
function audioCtx(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();return ctx}
function playSnd(t){
  try{let c=audioCtx(),n=c.currentTime,o,g;
  if(t==='correct'){o=c.createOscillator();g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.setValueAtTime(523,n);o.frequency.setValueAtTime(659,n+0.07);g.gain.setValueAtTime(0.25,n);g.gain.exponentialRampToValueAtTime(0.01,n+0.2);o.start(n);o.stop(n+0.2)}
  else if(t==='wrong'){o=c.createOscillator();g=c.createGain();o.connect(g);g.connect(c.destination);o.type='square';o.frequency.setValueAtTime(180,n);g.gain.setValueAtTime(0.12,n);g.gain.exponentialRampToValueAtTime(0.01,n+0.3);o.start(n);o.stop(n+0.3)}
  else if(t==='combo'){[660,880,1100].forEach((f,i)=>{o=c.createOscillator();g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.setValueAtTime(f,n+i*0.04);g.gain.setValueAtTime(0.2,n+i*0.04);g.gain.exponentialRampToValueAtTime(0.01,n+i*0.04+0.25);o.start(n+i*0.04);o.stop(n+i*0.04+0.25)})}
  else if(t==='perfect'){[523,659,784,1047].forEach((f,i)=>{o=c.createOscillator();g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.setValueAtTime(f,n+i*0.1);g.gain.setValueAtTime(0.2,n+i*0.1);g.gain.exponentialRampToValueAtTime(0.01,n+i*0.1+0.3);o.start(n+i*0.1);o.stop(n+i*0.1+0.3)})}
  }catch(e){}
}

// ═══════════ AUDIO ═══════════
let bestVoice=null;
function loadVoices(){
  let vs=speechSynthesis.getVoices();if(!vs.length)return;
  for(let n of['Samantha','Karen','Alex','Moira','Fiona']){bestVoice=vs.find(v=>v.name===n);if(bestVoice)break}
  if(!bestVoice)bestVoice=vs.find(v=>v.lang.startsWith('en'))||vs[0]
}
speechSynthesis.onvoiceschanged=loadVoices;loadVoices();
function speak(t,el){
  if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=0.85;u.pitch=1;if(bestVoice)u.voice=bestVoice;
  if(el)el.classList.add('playing');u.onend=u.onerror=()=>{if(el)el.classList.remove('playing')};
  window.speechSynthesis.speak(u)
}

// ═══════════ EBBINGHAUS ═══════════
function ebSchedule(stage,quality){
  let ns,iv;
  if(quality<=1){ns=1;iv=1}
  else if(quality===3){ns=Math.min(stage+2,EBBINGHAUS.length);iv=EBBINGHAUS[Math.min(ns-1,EBBINGHAUS.length-1)]}
  else{ns=Math.min(stage+1,EBBINGHAUS.length);iv=EBBINGHAUS[Math.min(ns-1,EBBINGHAUS.length-1)]}
  return{stage:ns,interval:iv}
}

// ═══════════ DAILY QUEUE ═══════════
function getDueWords(){
  let t=todayStr(),due=[];
  let ids=words.map(w=>w.id).sort(()=>Math.random()-0.5);
  for(let id of ids){let p=userState.wordProgress[id];if(!p||!p.nextReview||p.nextReview<=t)due.push(id)}
  return due.slice(0,Math.max(20,due.length))
}
function getTodayWords(){
  let tw=userState.todayWords||[];
  if(userState.lastStudyDate!==todayStr())tw=[];
  if(!tw.length)tw=getDueWords();return tw
}

// ═══════════ STREAK ═══════════
function calcStreak(){
  let s=userState.streak||0,t=new Date(),l=userState.lastStudyDate?new Date(userState.lastStudyDate):null;
  if(!l)return 1;
  let d=Math.floor((t-l)/86400000);
  if(d===0)return s;if(d===1)return s+1;return 1
}
function updateStreak(){userState.streak=calcStreak();userState.lastStudyDate=todayStr();saveState();document.getElementById('streak-badge').textContent='🔥 '+userState.streak+' 天'}

// ═══════════ EXERCISE SYSTEM ═══════════
let curWordIdx=0,curExIdx=0,exAnswered=false,sessXP=0,sessCombo=0,wordExercises=[],wordOK=0,wordNG=0;

function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function getDistractors(word,count,field){
  let others=words.filter(w=>w.id!==word.id);
  return shuffle(others).slice(0,count).map(w=>w[field])
}

function genExercises(word){
  let exs=[{type:'intro',word}],pool=[];
  // MC EN→ZH
  pool.push(()=>{let o=shuffle([word.translation,...getDistractors(word,3,'translation')]);return{type:'mc_enzh',word,badge:'英→中',bc:'translate',prompt:word.word,sub:'中文意思是？',options:o,correct:word.translation}});
  // MC ZH→EN
  pool.push(()=>{let o=shuffle([word.word,...getDistractors(word,3,'word')]);return{type:'mc_zhen',word,badge:'中→英',bc:'translate',prompt:word.translation,sub:'英文单词是？',options:o,correct:word.word}});
  // Listening
  pool.push(()=>{let o=shuffle([word.word,...getDistractors(word,3,'word')]);return{type:'listening',word,badge:'听力',bc:'listening',prompt:'🔊 听到的是？',sub:'点击喇叭听发音',options:o,correct:word.word,autoPlay:true}});
  // Fill-blank (only if has real examples)
  if(word.examples&&word.examples.length){pool.push(()=>{let ex=word.examples[Math.floor(Math.random()*word.examples.length)],bl=ex.sentence.replace(new RegExp(word.word,'gi'),'_____'),o=shuffle([word.word,...getDistractors(word,3,'word')]);return{type:'fill_blank',word,badge:'完形填空',bc:'fill',prompt:bl,sub:ex.translation,options:o,correct:word.word}})}
  // Phrase exercise
  if(word.phrases&&word.phrases.length){let ph=word.phrases[Math.floor(Math.random()*word.phrases.length)];pool.push(()=>{let o=shuffle([ph.translation,...getDistractors(word,3,'translation')]);return{type:'phrase',word,badge:'短语',bc:'match',prompt:'"'+ph.phrase+'"',sub:'意思是？',options:o,correct:ph.translation}})}
  // Pick 5 from pool
  for(let i=0;i<Math.min(5,pool.length);i++)pool.splice(Math.floor(Math.random()*pool.length),1)[0]().forEach?null:null;
  let picked=shuffle(pool).slice(0,5);
  for(let p of picked)exs.push(p());
  return exs
}

function startLearning(){
  userState.todayWords=getTodayWords();userState.lastStudyDate=todayStr();userState.streak=calcStreak();updateStreak();saveState();
  if(!userState.todayWords.length){userState.todayWords=words.map(w=>w.id).sort(()=>Math.random()-0.5);saveState()}
  showScreen('learn');curWordIdx=0;startWordLesson()
}
function resetDailyQueue(){userState.todayWords=getDueWords();if(!userState.todayWords.length)userState.todayWords=words.map(w=>w.id).sort(()=>Math.random()-0.5);saveState();curWordIdx=0;document.getElementById('learn-done').style.display='none';document.getElementById('learn-body').style.display='';startWordLesson()}
function startWordLesson(){
  let wid=getCurWordId();if(!wid){document.getElementById('learn-done').style.display='';document.getElementById('learn-body').style.display='none';return}
  document.getElementById('learn-done').style.display='none';document.getElementById('learn-body').style.display='';
  document.getElementById('rate-section').classList.remove('show');
  let word=getWordById(wid);if(!word){curWordIdx++;startWordLesson();return}
  wordExercises=genExercises(word);curExIdx=0;exAnswered=false;wordOK=0;wordNG=0;
  updateQueueInfo();renderDots();setMascot('happy','来看看这个单词 👀');renderExercise()
}
function getCurWordId(){return curWordIdx<(userState.todayWords||[]).length?userState.todayWords[curWordIdx]:null}
function updateQueueInfo(){document.getElementById('queue-info').textContent=(curWordIdx+1)+' / '+(userState.todayWords||[]).length}
function renderDots(){document.getElementById('ex-dots').innerHTML=wordExercises.map((_,i)=>{let c='dot';if(i<curExIdx)c+=' done';if(i===curExIdx)c+=' current';return'<span class="'+c+'"></span>'}).join('')}
function setMascot(mood,msg){let el=document.getElementById('mascot-icon');el.className='mascot-icon '+mood;el.textContent={happy:'🦉',think:'🤔',celebrate:'🎉',encourage:'💪'}[mood]||'🦉';document.getElementById('mascot-msg').textContent=msg}

function renderExercise(){
  if(curExIdx>=wordExercises.length){showSummary();return}
  exAnswered=false;let ex=wordExercises[curExIdx];
  document.getElementById('ex-fb').textContent='';document.getElementById('ex-fb').className='ex-fb';
  document.getElementById('ex-card').classList.remove('shake','pop');
  document.getElementById('rate-section').classList.remove('show');renderDots();
  if(ex.type==='intro'){setMascot('happy','来看看这个单词 👀');renderIntro(ex)}
  else{setMascot('think','选哪个呢？');renderQuiz(ex)}
}
function renderIntro(ex){
  let w=ex.word;
  document.getElementById('ex-body').innerHTML=
    '<div class="intro-word">'+w.word+'</div>'+
    '<div class="intro-phonetic">'+(w.phonetic||'')+'</div>'+
    '<button class="ex-audio" onclick="speak(\''+w.word.replace(/'/g,"\\'")+'\',this)">🔊</button>'+
    '<div class="intro-trans">'+w.translation+'</div>'+
    (w.phrases||[]).map(p=>'<div class="intro-phrase"><span class="en">'+p.phrase+'</span><span class="zh">'+p.translation+'</span></div>').join('')+
    '<button class="intro-start" onclick="startQuiz()">🚀 开始挑战！</button>';
  setTimeout(()=>speak(w.word,null),400)
}
function startQuiz(){curExIdx++;renderExercise()}
function renderQuiz(ex){
  let el=document.getElementById('ex-body');
  el.innerHTML=(ex.badge?'<span class="ex-badge '+ex.bc+'">'+ex.badge+'</span>':'')+
    '<div class="ex-prompt'+(ex.prompt.length>20?' sm':ex.prompt.length<8?' lg':'')+'">'+ex.prompt+'</div>'+
    '<div class="ex-sub">'+(ex.sub||'')+'</div>'+
    (ex.type==='listening'?'<button class="ex-audio" onclick="speak(\''+ex.word.word.replace(/'/g,"\\'")+'\',this)">🔊</button>':'')+
    '<div class="ex-opts'+(ex.options.some(o=>o.length>12)?' col1':'')+'">'+ex.options.map((o,i)=>'<button class="ex-opt" onclick="answerQuiz('+i+')">'+o+'</button>').join('')+'</div>';
  if(ex.autoPlay)setTimeout(()=>speak(ex.word.word,null),500)
}
function answerQuiz(idx){
  if(exAnswered)return;exAnswered=true;
  let ex=wordExercises[curExIdx],ok=ex.options[idx]===ex.correct,fb=document.getElementById('ex-fb'),card=document.getElementById('ex-card');
  document.querySelectorAll('.ex-opt').forEach((el,i)=>{el.disabled=true;if(ex.options[i]===ex.correct)el.classList.add('correct');if(i===idx&&!ok)el.classList.add('incorrect')});
  if(ok){fb.textContent='✅ 正确！';fb.className='ex-fb good';playSnd('correct');sessXP+=10;sessCombo++;wordOK++;userState.todayXP+=10;userState.totalXP+=10;userState.todayCorrect++;card.classList.add('pop');setMascot('happy','太棒了！🎉');
    if(sessCombo>=3){playSnd('combo');fb.textContent+=' 🔥 x'+sessCombo;sessXP+=5;userState.todayXP+=5;userState.totalXP+=5;let ce=document.getElementById('ex-combo');ce.classList.add('show');ce.classList.add('fire');setTimeout(()=>ce.classList.remove('fire'),300);floatXP('+5')}
    floatXP('+10')
  }else{fb.textContent='❌ '+ex.correct;fb.className='ex-fb bad';playSnd('wrong');sessCombo=0;wordNG++;card.classList.add('shake');setMascot('encourage','没关系，记住它！💪');let ds=document.querySelectorAll('.dot');if(ds[curExIdx])ds[curExIdx].classList.add('wrong')}
  userState.todayReviewed++;updateStatsBar();saveState();
  setTimeout(()=>{curExIdx++;if(curExIdx>=wordExercises.length)showSummary();else renderExercise()},ok?1000:1600)
}
function updateStatsBar(){
  document.getElementById('ex-xp').textContent='⭐ '+sessXP;
  let ce=document.getElementById('ex-combo');
  if(sessCombo>=3){ce.classList.add('show');ce.textContent='🔥 x'+sessCombo}else ce.classList.remove('show')
  renderDots()
}

function showSummary(){
  let word=getWordById(getCurWordId()),total=wordExercises.length-1,perfect=wordOK===total;
  document.getElementById('ex-fb').textContent='';document.getElementById('ex-fb').className='ex-fb';
  if(perfect){playSnd('perfect');setMascot('celebrate','全部正确！🏆');spawnConfetti()}else setMascot('encourage','继续加油！💪');
  document.getElementById('ex-body').innerHTML=
    '<div class="summary">'+(perfect?'<div class="perfect-badge">🌟 全部正确！</div>':'')+
    '<div class="big-word" style="margin-top:12px">'+word.word+'</div>'+
    '<div style="font-size:14px;color:var(--text2)">'+(word.phonetic||'')+'</div>'+
    '<div class="big-trans">'+word.translation+'</div>'+
    '<div class="stats">'+wordOK+'/'+total+' 正确'+(wordNG?' · '+wordNG+' 错误':'')+'</div></div>';
  document.getElementById('rate-section').classList.add('show')
}
function rateWord(q){
  let wid=getCurWordId();if(!wid)return;
  let prev=userState.wordProgress[wid]||{stage:0,correct:0,incorrect:0},r=ebSchedule(prev.stage||0,q);
  let nd=new Date();nd.setDate(nd.getDate()+r.interval);
  userState.wordProgress[wid]={stage:r.stage,interval:r.interval,correct:prev.correct+(q>=2?1:0),incorrect:prev.incorrect+(q<2?1:0),nextReview:nd.toISOString().slice(0,10),lastReviewed:todayStr()};
  userState.lastStudyDate=todayStr();userState.streak=calcStreak();saveState();
  curWordIdx++;
  if(curWordIdx>=(userState.todayWords||[]).length){document.getElementById('learn-done').style.display='';document.getElementById('learn-body').style.display='none';document.getElementById('done-title').textContent='🎉 任务完成！';document.getElementById('done-msg').textContent='获得 '+sessXP+' XP！明天继续加油 💪';updateHomeScreen();updateStats()}else startWordLesson()
}

// ═══════════ FX ═══════════
function floatXP(t){let el=document.createElement('div');el.className='xp-float';el.textContent=t;el.style.left=(40+Math.random()*40)+'%';el.style.top='40%';el.style.color=t.startsWith('+5')?'#F59E0B':'#10B981';document.body.appendChild(el);setTimeout(()=>el.remove(),1000)}
function spawnConfetti(){let e=['🌟','✨','🎉','💫','⭐'];for(let i=0;i<10;i++)setTimeout(()=>{let el=document.createElement('div');el.className='confetti';el.textContent=e[Math.floor(Math.random()*e.length)];el.style.left=(10+Math.random()*80)+'%';el.style.top=(20+Math.random()*30)+'%';el.style.animationDuration=(1+Math.random()*1.5)+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),2000)},i*60)}

// ═══════════ SCREENS ═══════════
function showScreen(n){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  let m={'home':'home','learn':'learn','stats':'stats'};if(m[n])document.getElementById(m[n]).classList.add('active');
  let t={'home':0,'learn':1,'stats':2};if(t[n]!==undefined)document.querySelectorAll('.tab-btn')[t[n]].classList.add('active');
  if(n==='stats')updateStats();if(n==='home')updateHomeScreen()
}

// ═══════════ HOME ═══════════
function updateHomeScreen(){
  let h=new Date().getHours(),g='早上好';if(h>=12&&h<18)g='下午好';if(h>=18)g='晚上好';
  document.getElementById('hero-greeting').innerHTML=g+' 👋<strong>'+(learnerName||'同学')+'</strong>';
  document.getElementById('hero-xp').textContent='⭐ '+(userState.totalXP||0)+' XP';
  document.getElementById('streak-badge').textContent='🔥 '+(userState.streak||0)+' 天';
  let t=userState.todayReviewed||0,g2=20,c=358;document.getElementById('prog-num').textContent=t+'/'+g2;
  document.getElementById('prog-fill').style.strokeDashoffset=c-(Math.min(t,g2)/g2)*c
}

// ═══════════ STATS ═══════════
function updateStats(){
  document.getElementById('stat-learned').textContent=Object.keys(userState.wordProgress).length;
  document.getElementById('stat-today').textContent=userState.todayReviewed||0;
  document.getElementById('stat-xp').textContent=userState.totalXP||0;
  let tc=Object.values(userState.wordProgress).reduce((s,p)=>s+(p.correct||0),0);
  let ta=Object.values(userState.wordProgress).reduce((s,p)=>s+(p.correct||0)+(p.incorrect||0),0);
  document.getElementById('stat-acc').textContent=ta>0?Math.round(tc/ta*100)+'%':'--%';
  renderEbbinghaus();renderErrors()
}
function renderEbbinghaus(){
  let sc=new Array(EBBINGHAUS.length+1).fill(0),cs=0;
  Object.values(userState.wordProgress).forEach(p=>{let s=p.stage||0;if(s<=EBBINGHAUS.length)sc[s]++;cs=Math.max(cs,s)});
  let pts=[100,58,44,80,52,85,55,90,60,95].map((y,i)=>{return(i/(9))*300+','+(90-y/100*80)}).join(' ');
  document.getElementById('eb-line').setAttribute('points',pts);
  document.getElementById('eb-stages').innerHTML=['初学','1天','2天','4天','7天','15天','30天','掌握'].map((l,i)=>{let c='eb-s';if(sc[i])c+=' has';if(i===cs&&sc[i])c+=' cur';if(i<cs&&sc[i])c+=' done';return'<span class="'+c+'">'+l+'<br>'+sc[i]+'词</span>'}).join('')
}
function renderErrors(){
  let errs=Object.entries(userState.wordProgress).filter(([_,p])=>(p.incorrect||0)>0).sort((a,b)=>(b[1].incorrect||0)-(a[1].incorrect||0)).slice(0,12);
  document.getElementById('err-count').textContent=errs.length?'— '+errs.length+' 个待复习':'— 暂无错题 🎉';
  document.getElementById('err-review').style.display=errs.length?'block':'none';
  document.getElementById('err-list').innerHTML=errs.map(([id,p])=>{let w=getWordById(id);if(!w)return'';let tot=(p.correct||0)+(p.incorrect||0),pct=tot?Math.round((p.correct||0)/tot*100):0;return'<div class="err-item" onclick="practiceWord(\''+id+'\')"><div><div class="word">'+w.word+'</div><div class="trans">'+w.translation+'</div></div><span class="badge">'+pct+'%</span></div>'}).join('')
}
function reviewErrors(){
  let ids=Object.entries(userState.wordProgress).filter(([_,p])=>(p.incorrect||0)>0).map(([id])=>id);
  if(!ids.length)return;userState.todayWords=ids.sort(()=>Math.random()-0.5);userState.lastStudyDate=todayStr();saveState();
  showScreen('learn');curWordIdx=0;startWordLesson();showToast('📕 复习 '+ids.length+' 个错题')
}
function practiceWord(id){userState.todayWords=[id];userState.lastStudyDate=todayStr();saveState();showScreen('learn');curWordIdx=0;startWordLesson();showToast('📕 练习: '+(getWordById(id)?.word||''))}

// ═══════════ TOAST ═══════════
function showToast(m){let t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}

// ═══════════ INIT ═══════════
async function init(){
  try{let r=await fetch(DB);words=await r.json()}catch(e){showToast('⚠️ 加载失败');return}
  loadState();learnerName=userState.learnerName||'';
  if(!learnerName){learnerName=prompt('你好！我是词博士猫头鹰 🦉\n你叫什么名字？','同学')||'同学';userState.learnerName=learnerName;saveState()}
  if(userState.lastStudyDate!==todayStr()){userState.todayReviewed=0;userState.todayCorrect=0;userState.todayXP=0}
  userState.streak=calcStreak();saveState();updateHomeScreen();updateStats();
  document.addEventListener('click',()=>{try{audioCtx().resume()}catch(e){}},{once:true})
}
init();
</script>
